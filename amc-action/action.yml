name: 'AMC Score — Agent Maturity Compass'
description: 'Run AMC eval on your agent, post results as a PR comment, fail on score drops, upload artifacts.'
author: 'AgentMaturity'

branding:
  icon: 'compass'
  color: 'blue'

inputs:
  agent-id:
    description: 'Agent identifier to evaluate'
    required: false
    default: 'default'
  target-level:
    description: 'Minimum AMC maturity level required (0–5). Build fails if score is below this.'
    required: false
    default: '0'
  fail-on-drop:
    description: 'Fail the build if the score drops compared to the base branch'
    required: false
    default: 'false'
  comment:
    description: 'Post results as a PR comment (true/false)'
    required: false
    default: 'true'
  upload-artifacts:
    description: 'Upload AMC result JSON and badge as workflow artifacts'
    required: false
    default: 'true'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  amc-version:
    description: 'Verified GitHub Release version (currently "1.2.0"), or "local" to build the action checkout'
    required: false
    default: '1.2.0'
  working-directory:
    description: 'Directory to run AMC in (repo root by default)'
    required: false
    default: '.'
  answers-file:
    description: 'Optional JSON answers file for deterministic scoring (amc quickscore --rapid --answers). When absent, evidence-based auto scoring is used.'
    required: false
    default: ''

outputs:
  score:
    description: 'AMC composite score (float)'
    value: ${{ steps.run-amc.outputs.score }}
  level:
    description: 'AMC maturity level string (L0–L5)'
    value: ${{ steps.run-amc.outputs.level }}
  passed:
    description: 'Whether the target-level gate passed (true/false)'
    value: ${{ steps.gate.outputs.passed }}
  result-json:
    description: 'Path to the full AMC result JSON file'
    value: ${{ steps.run-amc.outputs.result_path }}

runs:
  using: 'composite'
  steps:
    # The repository is a pnpm workspace (packageManager pnpm@10.33.0); npm ci cannot install from pnpm-lock.yaml (P0-46).
    - name: Set up pnpm
      if: inputs.amc-version == 'local'
      uses: pnpm/action-setup@v4
      with:
        version: 10.33.0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install AMC CLI
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.amc-version }}" in
          local)
            ACTION_REPOSITORY=$(CDPATH= cd -- "$GITHUB_ACTION_PATH/.." && pwd)
            pnpm --dir "$ACTION_REPOSITORY" install --frozen-lockfile
            pnpm --dir "$ACTION_REPOSITORY" run build
            npm install -g "$ACTION_REPOSITORY"
            ;;
          1.2.0)
            curl -fsSL https://agentmaturity.co/install.sh | sh
            ;;
          *)
            echo "Unsupported AMC release input. This preview action currently verifies only 1.2.0 or local." >&2
            exit 1
            ;;
        esac

    - name: Initialize AMC workspace
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # A committed .amc workspace is used as it is; its vault passphrase comes from AMC_VAULT_PASSPHRASE. A fresh one
        # gets a vault whose generated passphrase lives only in this job's environment, masked in the log.
        if [ -d .amc ]; then
          echo "Using the AMC workspace in $(pwd)/.amc."
          exit 0
        fi
        if [ -z "${AMC_VAULT_PASSPHRASE:-}" ]; then
          AMC_VAULT_PASSPHRASE="amc-ci-$(node -e 'process.stdout.write(require("crypto").randomBytes(24).toString("base64url"))')"
          echo "::add-mask::$AMC_VAULT_PASSPHRASE"
          echo "AMC_VAULT_PASSPHRASE=$AMC_VAULT_PASSPHRASE" >> "$GITHUB_ENV"
          export AMC_VAULT_PASSPHRASE
        fi
        amc init --minimal --profile ci

    - name: Run AMC evaluation
      id: run-amc
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        RESULT_PATH="${RUNNER_TEMP}/amc-result.json"

        extract_json() {
          node -e 'let s="";process.stdin.setEncoding("utf8");process.stdin.on("data",c=>{s+=c;});process.stdin.on("end",()=>{const start=s.indexOf("{");if(start<0){console.error("AMC produced no JSON output");process.exit(2);}let depth=0,inString=false,escape=false,end=-1;for(let i=start;i<s.length;i++){const ch=s[i];if(escape){escape=false;continue;}if(ch==="\\"){escape=true;continue;}if(ch==="\""){inString=!inString;continue;}if(inString)continue;if(ch==="{")depth++;if(ch==="}"){depth--;if(depth===0){end=i+1;break;}}}if(end<0){console.error("AMC JSON output was truncated");process.exit(2);}const candidate=s.slice(start,end);try{JSON.parse(candidate);console.log(candidate);}catch{console.error("AMC output was not valid JSON");process.exit(2);}});'
        }

        ANSWERS_FILE="${{ inputs.answers-file }}"
        STATUS=0
        if [ -n "$ANSWERS_FILE" ] && [ -f "$ANSWERS_FILE" ]; then
          RAW_RESULT=$(amc quickscore --rapid --answers "$ANSWERS_FILE" --json --agent "${{ inputs.agent-id }}") || STATUS=$?
        else
          RAW_RESULT=$(amc quickscore --auto --json --agent "${{ inputs.agent-id }}") || STATUS=$?
        fi
        RESULT=$(printf '%s\n' "$RAW_RESULT" | extract_json)
        echo "$RESULT" > "$RESULT_PATH"
        echo "result_path=$RESULT_PATH" >> "$GITHUB_OUTPUT"

        # No evidence yet is a result, never a crash and never a score: quickscore exits 1 with AUTO_NO_EVIDENCE, or its
        # report's result is not evaluated. score and level stay empty.
        if [ "$(echo "$RESULT" | jq -r '.scoreStatus == "AUTO_NO_EVIDENCE" or .statusDimensions.result == "not_evaluated"')" = "true" ]; then
          echo "evidence=none" >> "$GITHUB_OUTPUT"
          echo "## 🧭 AMC: no evidence yet" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No measured maturity score was produced for agent \`${{ inputs.agent-id }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" | jq -r '.error // empty, .firstRunHint // empty' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$STATUS" -ne 0 ]; then
          echo "::error::amc quickscore exited $STATUS: $(echo "$RESULT" | jq -r '.error // "no error message"')"
          exit "$STATUS"
        fi

        # Survey answers carry percentage and preliminaryLevel; an auto report carries layer levels, combined as the CLI's
        # Overall line combines them. A result with neither is refused, never read as 0 or L0.
        SCORE=$(echo "$RESULT" | jq -r '.score // .percentage // ([.layerScores[]?.avgFinalLevel] | if length > 0 then add / length * 100 | round / 100 else empty end)')
        LEVEL=$(echo "$RESULT" | jq -r '.level // .overallLevel // .preliminaryLevel // ([.layerScores[]?.avgFinalLevel] | if length > 0 then "L\(add / length | floor | [., 5] | min)" else empty end)')
        LEVEL_NUM=${LEVEL#L}
        if [ -z "$SCORE" ] || ! [[ "$LEVEL_NUM" =~ ^[0-5]$ ]]; then
          echo "::error::The AMC result names no score and L0-L5 level; see $RESULT_PATH."
          exit 1
        fi

        echo "score=$SCORE"         >> "$GITHUB_OUTPUT"
        echo "level=$LEVEL"         >> "$GITHUB_OUTPUT"
        echo "level_num=$LEVEL_NUM" >> "$GITHUB_OUTPUT"

        # Step summary
        echo "## 🧭 AMC Score: ${SCORE} (${LEVEL})" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Dimension | Score | Level |" >> "$GITHUB_STEP_SUMMARY"
        echo "|-----------|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "$RESULT" | jq -r '.dimensions // {} | to_entries[] | "| \(.key) | \(.value.score) | \(.value.level) |"' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

    - name: Score-drop detection (base branch comparison)
      id: drop
      if: inputs.fail-on-drop == 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        extract_json() {
          node -e 'let s="";process.stdin.setEncoding("utf8");process.stdin.on("data",c=>{s+=c;});process.stdin.on("end",()=>{const start=s.indexOf("{");if(start<0){console.error("AMC produced no JSON output");process.exit(2);}let depth=0,inString=false,escape=false,end=-1;for(let i=start;i<s.length;i++){const ch=s[i];if(escape){escape=false;continue;}if(ch==="\\"){escape=true;continue;}if(ch==="\""){inString=!inString;continue;}if(inString)continue;if(ch==="{")depth++;if(ch==="}"){depth--;if(depth===0){end=i+1;break;}}}if(end<0){console.error("AMC JSON output was truncated");process.exit(2);}const candidate=s.slice(start,end);try{JSON.parse(candidate);console.log(candidate);}catch{console.error("AMC output was not valid JSON");process.exit(2);}});'
        }

        # Checkout base branch, score it, compare
        git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
        git stash push -u -m "amc-action-base-comparison" >/dev/null 2>&1 || true
        ANSWERS_FILE="${{ inputs.answers-file }}"
        if git checkout "origin/${{ github.base_ref }}" -- . 2>/dev/null; then
          if [ -n "$ANSWERS_FILE" ] && [ -f "$ANSWERS_FILE" ]; then
            if ! RAW_BASE_RESULT=$(amc quickscore --rapid --answers "$ANSWERS_FILE" --json --agent "${{ inputs.agent-id }}"); then
              RAW_BASE_RESULT=""
            fi
          else
            if ! RAW_BASE_RESULT=$(amc quickscore --auto --json --agent "${{ inputs.agent-id }}"); then
              RAW_BASE_RESULT=""
            fi
          fi
        else
          RAW_BASE_RESULT=""
        fi
        git restore --source=HEAD --staged --worktree . 2>/dev/null || true
        git stash pop 2>/dev/null || true

        HEAD_SCORE="${{ steps.run-amc.outputs.score }}"
        if [ -n "$RAW_BASE_RESULT" ]; then
          BASE_RESULT=$(printf '%s\n' "$RAW_BASE_RESULT" | extract_json)
          BASE_SCORE=$(echo "$BASE_RESULT" | jq -r 'if .scoreStatus == "AUTO_NO_EVIDENCE" or .statusDimensions.result == "not_evaluated" then empty else .score // .percentage // ([.layerScores[]?.avgFinalLevel] | if length > 0 then add / length * 100 | round / 100 else empty end) end')
        fi
        # Removing evidence is a drop: a measured base with no evidence on this branch fails fail-on-drop. Only when
        # neither side has evidence is there nothing to compare.
        if [ "${{ steps.run-amc.outputs.evidence }}" = "none" ]; then
          if [ -n "${BASE_SCORE:-}" ]; then
            echo "base_score=$BASE_SCORE" >> "$GITHUB_OUTPUT"
            echo "evidence_removed=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Evidence removed: the base branch scored ${BASE_SCORE}; this branch has no evidence yet." >> "$GITHUB_STEP_SUMMARY"
            DROPPED=true
          else
            echo "base_score=unavailable" >> "$GITHUB_OUTPUT"
            echo "Neither branch has evidence yet; skipping drop comparison." >> "$GITHUB_STEP_SUMMARY"
            DROPPED=false
          fi
        elif [ -n "${BASE_SCORE:-}" ]; then
          echo "base_score=$BASE_SCORE" >> "$GITHUB_OUTPUT"
          DROPPED=$(python3 -c "print('true' if float('$HEAD_SCORE') < float('$BASE_SCORE') else 'false')")
        else
          echo "base_score=unavailable" >> "$GITHUB_OUTPUT"
          echo "Base branch could not be scored; skipping drop comparison." >> "$GITHUB_STEP_SUMMARY"
          DROPPED=false
        fi
        echo "dropped=$DROPPED" >> "$GITHUB_OUTPUT"

        if [ "$DROPPED" = "true" ] && [ "${{ steps.run-amc.outputs.evidence }}" != "none" ]; then
          echo "⚠️ Score dropped: ${BASE_SCORE} → ${HEAD_SCORE}" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Target-level gate
      id: gate
      shell: bash
      run: |
        set -euo pipefail
        TARGET=${{ inputs.target-level }}
        EVIDENCE="${{ steps.run-amc.outputs.evidence }}"
        LEVEL_NUM="${{ steps.run-amc.outputs.level_num }}"
        DROPPED="${{ steps.drop.outputs.dropped || 'false' }}"
        FAIL_ON_DROP="${{ inputs.fail-on-drop }}"

        PASSED=true
        REASON=""

        if [ "$EVIDENCE" = "none" ]; then
          if [ "$TARGET" -gt 0 ]; then
            PASSED=false
            REASON="no evidence yet: AMC has no measured level to compare with the required L${TARGET}"
          fi
        elif ! [[ "$LEVEL_NUM" =~ ^[0-5]$ ]]; then
          PASSED=false
          REASON="the AMC result has no level"
        elif [ "$TARGET" -gt 0 ] && [ "$LEVEL_NUM" -lt "$TARGET" ]; then
          PASSED=false
          REASON="AMC level L${LEVEL_NUM} is below required L${TARGET}"
        fi

        if [ "$FAIL_ON_DROP" = "true" ] && [ "$DROPPED" = "true" ]; then
          PASSED=false
          if [ "${{ steps.drop.outputs.evidence_removed }}" = "true" ]; then
            REASON="${REASON:+${REASON}; }evidence removed: the base branch has a measured score and this branch has none"
          else
            REASON="${REASON:+${REASON}; }Score dropped from base branch"
          fi
        fi

        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

        if [ "$PASSED" = "false" ]; then
          echo "❌ Gate failed: $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::AMC gate failed: $REASON"
          exit 1
        elif [ "$EVIDENCE" = "none" ]; then
          echo "✅ AMC gate passed: no target level is set, and there is no evidence yet" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "✅ AMC gate passed — L${LEVEL_NUM} (${{ steps.run-amc.outputs.score }})" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Generate badge
      id: badge
      if: always()
      shell: bash
      run: |
        LEVEL="${{ steps.run-amc.outputs.level }}"
        SCORE="${{ steps.run-amc.outputs.score }}"
        LEVEL_NUM=${{ steps.run-amc.outputs.level_num }}
        if ! [[ "$LEVEL_NUM" =~ ^[0-9]+$ ]]; then LEVEL_NUM=0; fi

        if [ "$LEVEL_NUM" -ge 4 ]; then COLOR="brightgreen";
        elif [ "$LEVEL_NUM" -ge 3 ]; then COLOR="green";
        elif [ "$LEVEL_NUM" -ge 2 ]; then COLOR="yellow";
        elif [ "$LEVEL_NUM" -ge 1 ]; then COLOR="orange";
        else COLOR="red"; fi

        BADGE_URL="https://img.shields.io/badge/AMC-${LEVEL}%20(${SCORE})-${COLOR}?logo=data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTEyIDJMMiA3bDEwIDUgMTAtNXptMCA5bC04LjUtNC4yNUwyIDEybDEwIDUgMTAtNXptMCA5bC04LjUtNC4yNUwyIDIxbDEwIDUgMTAtNXoiLz48L3N2Zz4="
        if [ "${{ steps.run-amc.outputs.evidence }}" = "none" ]; then
          BADGE_URL="https://img.shields.io/badge/AMC-no%20evidence%20yet-lightgrey"
        fi
        echo "badge_url=$BADGE_URL" >> "$GITHUB_OUTPUT"

        # Save badge markdown to temp for artifact
        echo "[![AMC Score](${BADGE_URL})](https://github.com/${{ github.repository }})" > "${RUNNER_TEMP}/amc-badge.md"

    - name: Comment on PR
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const resultPath = '${{ steps.run-amc.outputs.result_path }}';
          let result = {};
          try { result = JSON.parse(fs.readFileSync(resultPath, 'utf8')); } catch {}

          // The scoring step's outputs, not the raw result: no evidence yet and a failed evaluation are never a score.
          const noEvidence = '${{ steps.run-amc.outputs.evidence }}' === 'none';
          const score = '${{ steps.run-amc.outputs.score }}';
          const level = '${{ steps.run-amc.outputs.level }}';
          const targetLevel = parseInt('${{ inputs.target-level }}') || 0;
          const passed = '${{ steps.gate.outputs.passed }}' !== 'false';
          const dropped = '${{ steps.drop.outputs.dropped }}' === 'true';
          const baseScore = '${{ steps.drop.outputs.base_score }}';

          let dimTable = '| Dimension | Score | Level |\n|-----------|-------|-------|\n';
          if (result.dimensions) {
            for (const [name, data] of Object.entries(result.dimensions)) {
              dimTable += `| ${name} | ${data.score} | ${data.level} |\n`;
            }
          } else if (Array.isArray(result.layerScores)) {
            for (const layer of result.layerScores) {
              const score = layer.avgLevel ?? layer.avgFinalLevel ?? layer.totalScore ?? 0;
              dimTable += `| ${layer.layerName} | ${score} | ${level} |\n`;
            }
          }

          const statusEmoji = passed ? '✅' : '❌';
          let statusLine = passed
            ? `Meets${targetLevel > 0 ? ` required L${targetLevel}` : ''} threshold`
            : `Below required L${targetLevel}`;
          if (dropped) statusLine += ` · ⚠️ Score dropped from ${baseScore}`;

          const badge = '${{ steps.badge.outputs.badge_url }}';
          const footer = `---
          *[Agent Maturity Compass](https://github.com/AgentMaturity/AgentMaturityCompass) · amc-action v1*
          <!-- amc-action -->`;
          const body = noEvidence
            ? `## ${passed ? '⚪' : '❌'} AMC: no evidence yet

          No measured maturity score was produced. ${result.firstRunHint ?? 'Capture evidence with `amc wrap <runtime> -- <your-agent-command>`, or score survey answers with the `answers-file` input.'}

          **Status:** ${'${{ steps.drop.outputs.evidence_removed }}' === 'true' ? `Evidence removed: the base branch scored ${baseScore}` : passed ? 'No target level is set' : `No measured level to compare with the required L${targetLevel}`}

          ${footer}`
            : !level
            ? `## ❌ AMC: no result

          The AMC evaluation step did not produce a score; see the job log.

          ${footer}`
            : `## ${statusEmoji} AMC Score: ${score} (${level})

          ![AMC Badge](${badge})

          ${dimTable}

          **Status:** ${statusLine}

          ${footer}`;

          // Upsert: find existing AMC comment and update, or create new
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && (c.body.includes('<!-- amc-action -->') || c.body.includes('AMC Score:')));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }

    - name: Upload artifacts
      if: always() && inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: amc-results
        path: |
          ${{ steps.run-amc.outputs.result_path }}
          ${{ runner.temp }}/amc-badge.md
        retention-days: 90
