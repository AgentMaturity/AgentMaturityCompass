        - "L1-TECH-06/positive/evidence-valid.json"
      "negative":
        - "L1-TECH-06/negative/evidence-stale.json"
        - "L1-TECH-06/negative/evidence-replayed.json"
        - "L1-TECH-06/negative/evidence-contradictory.json"
