# technology.gpai-integrator-docs. Experimental and unreviewed; synthetic fixtures do not establish production enforcement.
"id": "L1-TECH-06"
"version": "0.1.0"
"support": "experimental"
"layer": 1
"family": "upstream-model-documentation"
"stations":
  - "technology"
"title": "Pin upstream model documentation to each integrated version"
"statement": "An integrator retains the upstream documentation for each pinned model version and records how
  its capabilities and limitations inform the agent's risk assessment."
"riskRationale": "Documentation for a different model release can omit limitations or integration conditions
  relevant to the deployed agent."
"mandatory": true
"applicability":
  "predicate":
    "all":
      - "fact": "stations"
        "includesAny":
          - "technology"
      - "fact": "domains"
        "includesAny":
          - "technology.platforms-data"
      - "fact": "jurisdictions"
        "includesAny":
          - "EU"
  "reasons":
    - "Experimental, unreviewed draft for technology.platforms-data; applicability facts are operator
      assertions and require a scoped legal determination."
  "exclusions":
    - "when":
        "not":
          "fact": "domains"
          "includesAny":
            - "technology.platforms-data"
      "reason": "The deployment is outside the Technology platforms-and-data domain; no legal applicability is
        inferred from a station name."
    - "when":
        "not":
          "fact": "jurisdictions"
          "includesAny":
            - "EU"
      "reason": "The deployment has no asserted nexus to this control's jurisdiction; unresolved jurisdiction is not
        treated as an exclusion or a pass."
