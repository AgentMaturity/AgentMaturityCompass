# technology.nis2-early-warning. Experimental and unreviewed; synthetic fixtures do not establish production enforcement.
"id": "L1-TECH-07"
"version": "0.1.0"
"support": "experimental"
"layer": 1
"family": "incident-warning"
"stations":
  - "technology"
"title": "Exercise the existing NIS2 early-warning clock"
"statement": "An early-warning drill preserves a scoped incident-awareness record and a complete draft warning
  packet against the existing 24-hour NIS2 clock."
"riskRationale": "An incident timestamp without entity applicability, awareness provenance or warning content
  cannot show that a notification duty was performed."
"mandatory": true
"applicability":
  "predicate":
    "all":
      - "fact": "stations"
        "includesAny":
          - "technology"
      - "fact": "domains"
        "includesAny":
          - "technology.platforms-data"
      - "fact": "jurisdictions"
        "includesAny":
          - "EU"
  "reasons":
    - "Experimental, unreviewed draft for technology.platforms-data; applicability facts are operator
      assertions and require a scoped legal determination."
  "exclusions":
    - "when":
        "not":
          "fact": "domains"
          "includesAny":
            - "technology.platforms-data"
      "reason": "The deployment is outside the Technology platforms-and-data domain; no legal applicability is
        inferred from a station name."
    - "when":
        "not":
          "fact": "jurisdictions"
          "includesAny":
            - "EU"
      "reason": "The deployment has no asserted nexus to this control's jurisdiction; unresolved jurisdiction is not
        treated as an exclusion or a pass."
