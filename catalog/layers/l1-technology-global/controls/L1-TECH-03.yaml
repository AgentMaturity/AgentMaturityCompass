    "clause": "SECURE_CONFIGURATION.TOOLS_POLICY"
    "relation": "partial"
    "rationale": "The internal audit-map control is related, but does not cover this station-specific requirement,
      legal scope or oracle. Mapping is experimental and unreviewed."
