# technology.coppa-third-party-consent. Experimental and unreviewed; synthetic fixtures do not establish production enforcement.
"id": "L1-TECH-04"
"version": "0.1.0"
"support": "experimental"
"layer": 1
"family": "child-data-disclosure"
"stations":
  - "technology"
"title": "Require a scoped record before third-party child-data disclosure"
"statement": "A proposed disclosure of child personal information to a third party requires a separate,
  current parental-consent record for that disclosure purpose and an identified retention policy."
"riskRationale": "A general notice or a consent record for another purpose cannot establish permission for a
  third-party disclosure of child personal information."
"mandatory": true
"applicability":
  "predicate":
    "all":
      - "fact": "stations"
        "includesAny":
          - "technology"
      - "fact": "domains"
        "includesAny":
          - "technology.platforms-data"
      - "fact": "jurisdictions"
        "includesAny":
          - "US"
  "reasons":
    - "Experimental, unreviewed draft for technology.platforms-data; applicability facts are operator
      assertions and require a scoped legal determination."
    - "COPPA audience, personal-information and recipient scope require an explicit determination; a station
      tag is insufficient."
  "exclusions":
    - "when":
        "not":
          "fact": "domains"
          "includesAny":
            - "technology.platforms-data"
      "reason": "The deployment is outside the Technology platforms-and-data domain; no legal applicability is
        inferred from a station name."
    - "when":
        "not":
          "fact": "jurisdictions"
          "includesAny":
            - "US"
      "reason": "The deployment has no asserted nexus to this control's jurisdiction; unresolved jurisdiction is not
        treated as an exclusion or a pass."
