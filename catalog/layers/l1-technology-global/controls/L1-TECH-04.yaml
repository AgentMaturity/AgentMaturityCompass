  "mechanism": "Target boundary: egress. A consent-aware production adapter is absent; no allowed host,
    questionnaire answer or fixture record authorizes an actual disclosure. Unknown audience, scope or consent
    remains not evaluated and requires refusal before any disclosure."
  "parameters": []
  "manualDuty": null
"tests":
