binding:
  kind: "manual"
  points: []
  mechanism: "The named deployment owner obtains the assessment and required human decisions before activating the
    plan. A test-only signed activation log checks structure, identity and chronology; it does not wire the
    production activation path or judge assessment quality."
  parameters: []
  manualDuty:
    duty: "Obtain a deployment-scoped FRIA, arrange independent human content assessment and required notification,
      and retain their records before first use and material changes."
    ownerRole: "senior_manager"
    cadence: "Before first activation and each change requiring reassessment; exact legal scope remains unverified."
    evidenceOfPerformance: "The FRIA, six-element content, assessor decision, authority-notification record and plan
      activation record, linked to the same deployment and plan."
tests:
  - id: "L1-GOV-02-T1"
    type: "drill"
    oracle:
      kind: "system_of_record"
      observes: "Test-only reference-agent effects, captures, refusals and local reason codes. Synthetic local
        outcomes are separate from the envelope evidence result and never stand in for an agency, law firm or
        defense deployment."
    fixtures:
      positive:
        - "L1-GOV-02/positive/oracle-fria-before-use.json"
      negative:
        - "L1-GOV-02/negative/oracle-fria-missing.json"
        - "L1-GOV-02/negative/oracle-fria-late.json"
        - "L1-GOV-02/negative/oracle-notification-missing.json"
        - "L1-GOV-02/negative/oracle-activation-unavailable.json"
    passCriteria: "Each local reference-agent case matches its separately declared synthetic result. Missing
      authorities or system records cause no effect. No local outcome supplies an observed production producer
      or a positive regulated result."
    attempts: 1
  - id: "L1-GOV-02-T2"
    type: "drill"
    oracle:
      kind: "system_of_record"
      observes: "P1-11 evaluateControl admission, rejection and evidence/result dimensions for the actual admitted
        questionnaire producer. The producer caps all records at self_reported."
    fixtures:
      positive:
        - "L1-GOV-02/positive/evidence-valid.json"
      negative:
        - "L1-GOV-02/negative/evidence-stale.json"
        - "L1-GOV-02/negative/evidence-replayed.json"
        - "L1-GOV-02/negative/evidence-contradictory.json"
        - "L1-GOV-02/negative/evidence-cross-tenant.json"
        - "L1-GOV-02/negative/evidence-empty.json"
        - "L1-GOV-02/negative/evidence-violation.json"
    passCriteria: "The valid self-reported example cannot pass. Stale, replayed, contradictory, cross-tenant and
      empty examples exercise their actual evidence rules; an admitted self-reported violation fails
      conservatively. Empty production evidence remains not_evaluated with enforcement none."
    attempts: 1
evidence:
  - id: "L1-GOV-02-E1"
    producer: "amc.questionnaire"
    bindingFields:
      - "tenantId"
      - "workspaceId"
      - "deploymentId"
      - "agentId"
      - "controlId"
      - "controlVersion"
    freshness:
      maxAgeDays: 30
    sampling:
      method: "all"
      ratePercent: null
      minItems: 1
    retention:
      mode: "regime_max"
    residency:
      mode: "inherit_deployment"
