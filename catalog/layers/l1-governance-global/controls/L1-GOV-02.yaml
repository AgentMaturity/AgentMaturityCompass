title: "A structurally complete FRIA precedes plan activation"
statement: "For a deployment selecting this draft FRIA prerequisite, refuse plan activation without the six
  scoped assessment elements, an authorized assessor decision and authority-notification record that precede
  activation. Human assessors determine the quality and legal sufficiency of the assessment."
riskRationale: "Checking only for a document can admit an assessment created after use, an unbound approval or a
  missing authority notification."
mandatory: true
