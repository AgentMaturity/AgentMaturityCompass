binding:
  kind: "enforcement_point"
  points:
    - "tool_pipeline"
    - "approvals"
  mechanism: "Draft integration target: the finalization tool checks an authoritative, context-bound case decision
    and notice before any effect. The local case-system oracle is a synthetic drill; no case-system producer or
    live tool integration is declared here."
  parameters: []
  manualDuty: null
tests:
  - id: "L1-GOV-01-T1"
    type: "drill"
    oracle:
      kind: "system_of_record"
      observes: "Test-only reference-agent effects, captures, refusals and local reason codes. Synthetic local
        outcomes are separate from the envelope evidence result and never stand in for an agency, law firm or
        defense deployment."
    fixtures:
      positive:
        - "L1-GOV-01/positive/oracle-human-decision.json"
      negative:
        - "L1-GOV-01/negative/oracle-missing-decision.json"
        - "L1-GOV-01/negative/oracle-prompt-only.json"
        - "L1-GOV-01/negative/oracle-missing-appeal.json"
        - "L1-GOV-01/negative/oracle-store-unavailable.json"
    passCriteria: "Each local reference-agent case matches its separately declared synthetic result. Missing
      authorities or system records cause no effect. No local outcome supplies an observed production producer
      or a positive regulated result."
    attempts: 1
  - id: "L1-GOV-01-T2"
    type: "drill"
    oracle:
      kind: "system_of_record"
      observes: "P1-11 evaluateControl admission, rejection and evidence/result dimensions for the actual admitted
        questionnaire producer. The producer caps all records at self_reported."
    fixtures:
      positive:
        - "L1-GOV-01/positive/evidence-valid.json"
      negative:
        - "L1-GOV-01/negative/evidence-stale.json"
        - "L1-GOV-01/negative/evidence-replayed.json"
        - "L1-GOV-01/negative/evidence-contradictory.json"
        - "L1-GOV-01/negative/evidence-cross-tenant.json"
        - "L1-GOV-01/negative/evidence-empty.json"
        - "L1-GOV-01/negative/evidence-violation.json"
    passCriteria: "The valid self-reported example cannot pass. Stale, replayed, contradictory, cross-tenant and
      empty examples exercise their actual evidence rules; an admitted self-reported violation fails
      conservatively. Empty production evidence remains not_evaluated with enforcement none."
    attempts: 1
evidence:
  - id: "L1-GOV-01-E1"
    producer: "amc.questionnaire"
    bindingFields:
      - "tenantId"
      - "workspaceId"
      - "deploymentId"
      - "agentId"
      - "controlId"
      - "controlVersion"
    freshness:
      maxAgeDays: 30
    sampling:
      method: "all"
      ratePercent: null
      minItems: 1
    retention:
      mode: "regime_max"
    residency:
      mode: "inherit_deployment"
invalidatedBy:
