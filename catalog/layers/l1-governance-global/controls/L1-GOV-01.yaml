id: "L1-GOV-01"
version: "0.1.0"
support: "experimental"
layer: 1
family: "caseworker-decides-benefits"
stations:
  - "governance"
title: "An identity-bound caseworker decides the benefit"
statement: "Finalize a benefit decision only after the authorized human caseworker records a decision bound to
  the same case and execution context. The notice identifies AI involvement and the appeal route. Prompt text
  never supplies that decision."
riskRationale: "An agent recommendation or an unbound approval can be mistaken for the accountable human
  decision, while an incomplete notice can hide the route to challenge it."
mandatory: true
