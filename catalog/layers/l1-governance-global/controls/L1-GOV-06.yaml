id: "L1-GOV-06"
version: "0.1.0"
support: "experimental"
layer: 1
family: "defense.cui-never-leaves-boundary"
stations:
  - "governance"
  - "technology"
title: "CUI-origin resources remain inside the selected boundary"
statement: "Refuse a request carrying a CUI-marked resource, or an unmarked resource from a CUI store, when its
  destination is outside the context-bound boundary. An unavailable boundary map or capture provides no egress
  permission."
riskRationale: "Dropping an individual marking does not change a resource’s CUI-store origin, and a guessed or
  missing destination boundary cannot support a safe egress decision."
mandatory: true
applicability:
