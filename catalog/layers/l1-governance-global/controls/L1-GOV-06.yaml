binding:
  kind: "enforcement_point"
  points:
    - "egress"
  mechanism: "Draft egress target: bind resource origin and the boundary map to the deployment and plan, then
    check each destination before any effect. The local simulator uses synthetic content and performs no network
    request. It does not establish CMMC status or Phase II applicability."
  parameters: []
  manualDuty: null
tests:
  - id: "L1-GOV-06-T1"
    type: "drill"
    oracle:
      kind: "system_of_record"
      observes: "Test-only reference-agent effects, captures, refusals and local reason codes. Synthetic local
        outcomes are separate from the envelope evidence result and never stand in for an agency, law firm or
        defense deployment."
    fixtures:
      positive:
        - "L1-GOV-06/positive/oracle-inside-boundary.json"
      negative:
        - "L1-GOV-06/negative/oracle-public-endpoint.json"
        - "L1-GOV-06/negative/oracle-unmarked-cui-store.json"
        - "L1-GOV-06/negative/oracle-boundary-missing.json"
        - "L1-GOV-06/negative/oracle-capture-unavailable.json"
    passCriteria: "Each local reference-agent case matches its separately declared synthetic result. Missing
      authorities or system records cause no effect. No local outcome supplies an observed production producer
      or a positive regulated result."
    attempts: 1
  - id: "L1-GOV-06-T2"
    type: "drill"
    oracle:
      kind: "system_of_record"
      observes: "P1-11 evaluateControl admission, rejection and evidence/result dimensions for the actual admitted
        questionnaire producer. The producer caps all records at self_reported."
    fixtures:
      positive:
        - "L1-GOV-06/positive/evidence-valid.json"
      negative:
        - "L1-GOV-06/negative/evidence-stale.json"
        - "L1-GOV-06/negative/evidence-replayed.json"
        - "L1-GOV-06/negative/evidence-contradictory.json"
        - "L1-GOV-06/negative/evidence-cross-tenant.json"
        - "L1-GOV-06/negative/evidence-empty.json"
        - "L1-GOV-06/negative/evidence-violation.json"
    passCriteria: "The valid self-reported example cannot pass. Stale, replayed, contradictory, cross-tenant and
      empty examples exercise their actual evidence rules; an admitted self-reported violation fails
      conservatively. Empty production evidence remains not_evaluated with enforcement none."
    attempts: 1
evidence:
  - id: "L1-GOV-06-E1"
    producer: "amc.questionnaire"
    bindingFields:
