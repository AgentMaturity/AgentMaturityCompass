id: "L1-GOV-05"
version: "0.1.0"
support: "experimental"
layer: 1
family: "explanation-request-reaches-human"
stations:
  - "governance"
title: "Explanation requests reach an authorized human reviewer"
statement: "Route a decision-explanation request to an authorized human reviewer within the explicitly selected
  profile window. An automatic reply, an unauthorized recipient or a late route does not satisfy the duty.
  Routing does not establish the content or sufficiency of an explanation."
riskRationale: "A nominal response can hide that nobody with authority reviewed the request, while a prompt
  response without a routing record is not evidence of human handling."
mandatory: true
