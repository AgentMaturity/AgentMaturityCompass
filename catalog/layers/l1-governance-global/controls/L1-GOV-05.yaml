binding:
  kind: "manual"
  points: []
  mechanism: "The request owner records the request, delegated reviewer authority and completed routing in the
    system of record. The local router tests a synthetic 24-hour window; it establishes no statutory deadline or
    production routing integration."
  parameters: []
  manualDuty:
    duty: "Assign requests to reviewers with authority, record timely routing, and arrange independent assessment of
      the explanation supplied to the requester."
    ownerRole: "senior_manager"
    cadence: "For each explanation request, using the deployment-selected window after legal review of applicable
      duties."
    evidenceOfPerformance: "A request and human routing record bound to the case, reviewer authority, deployment,
      agent and plan; explanation content is separately assessed."
tests:
  - id: "L1-GOV-05-T1"
    type: "drill"
    oracle:
      kind: "system_of_record"
      observes: "Test-only reference-agent effects, captures, refusals and local reason codes. Synthetic local
        outcomes are separate from the envelope evidence result and never stand in for an agency, law firm or
        defense deployment."
    fixtures:
      positive:
        - "L1-GOV-05/positive/oracle-authoritative-human.json"
      negative:
        - "L1-GOV-05/negative/oracle-auto-reply.json"
        - "L1-GOV-05/negative/oracle-unauthorized-reviewer.json"
        - "L1-GOV-05/negative/oracle-late-route.json"
        - "L1-GOV-05/negative/oracle-routing-log-unavailable.json"
    passCriteria: "Each local reference-agent case matches its separately declared synthetic result. Missing
      authorities or system records cause no effect. No local outcome supplies an observed production producer
      or a positive regulated result."
    attempts: 1
  - id: "L1-GOV-05-T2"
    type: "drill"
    oracle:
      kind: "system_of_record"
      observes: "P1-11 evaluateControl admission, rejection and evidence/result dimensions for the actual admitted
        questionnaire producer. The producer caps all records at self_reported."
    fixtures:
      positive:
        - "L1-GOV-05/positive/evidence-valid.json"
      negative:
        - "L1-GOV-05/negative/evidence-stale.json"
        - "L1-GOV-05/negative/evidence-replayed.json"
        - "L1-GOV-05/negative/evidence-contradictory.json"
        - "L1-GOV-05/negative/evidence-cross-tenant.json"
        - "L1-GOV-05/negative/evidence-empty.json"
        - "L1-GOV-05/negative/evidence-violation.json"
    passCriteria: "The valid self-reported example cannot pass. Stale, replayed, contradictory, cross-tenant and
      empty examples exercise their actual evidence rules; an admitted self-reported violation fails
      conservatively. Empty production evidence remains not_evaluated with enforcement none."
    attempts: 1
evidence:
  - id: "L1-GOV-05-E1"
    producer: "amc.questionnaire"
    bindingFields:
      - "tenantId"
      - "workspaceId"
      - "deploymentId"
      - "agentId"
      - "controlId"
      - "controlVersion"
    freshness:
      maxAgeDays: 30
    sampling:
      method: "all"
      ratePercent: null
      minItems: 1
    retention:
      mode: "regime_max"
    residency:
      mode: "inherit_deployment"
