# Draft (P1-18): wealth.us.credit-reasons. Experimental, agent-drafted and not independently reviewed; expert sign-off waits for D-08.
# Extends L0-EXP-01 (Layer 0, P1-14) with the US finance parameter and citation.
# A result under this control is evidence of conformity, never proof of compliance.

id: L1-WLT-US-13
version: "0.1.0"
support: experimental
layer: 1
family: credit-decisions
stations: [wealth]
title: Specific reasons that match the decision's drivers
statement: An adverse credit decision states at most four specific reasons, and they are the factors that drove the decision.
riskRationale: Regulation B requires specific principal reasons for adverse action, including for complex models;
  reasons that do not match the drivers mislead the applicant.
mandatory: true
applicability:
  predicate: {fact: useCases, includesAny: [credit_decision]}
  reasons:
    - Applies only where the profile's use cases include credit decisions; the finance-operations profile leaves it out.
  exclusions:
    - when:
        all:
          - {fact: useCases, includesAny: [reconciliation]}
          - not: {fact: useCases, includesAny: [credit_decision]}
      reason: A finance-operations agent that makes no credit decision is out of scope.
