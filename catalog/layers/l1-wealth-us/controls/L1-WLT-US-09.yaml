binding:
  kind: manual
  points: []
  mechanism: A named owner keeps the tiered register of AI vendors; detecting a silent model change needs the signed
    version manifest (P1-75, not built yet).
  parameters: []
  manualDuty:
    duty: Keep a tiered register of model vendors, agent platforms, tool providers and MCP servers with due diligence,
      contract terms and monitoring per tier.
    ownerRole: senior_manager
    cadence: quarterly and at onboarding
    evidenceOfPerformance: The vendor register and a review record per vendor.
tests:
  - id: L1-WLT-US-09-T1
    type: document_review
    oracle:
      kind: human_assessor
      observes: The vendor register, its review records and any model change found without a manifest entry.
    fixtures:
      positive: [L1-WLT-US-09/positive/evidence-valid.json]
      negative:
        - L1-WLT-US-09/negative/evidence-contradictory.json
        - L1-WLT-US-09/negative/evidence-cross-tenant.json
        - L1-WLT-US-09/negative/evidence-empty.json
        - L1-WLT-US-09/negative/evidence-replayed.json
        - L1-WLT-US-09/negative/evidence-stale.json
        - L1-WLT-US-09/negative/evidence-violation.json
    passCriteria: Every AI vendor in use is in the register with a tier and a current review, and a model change without a
      version-manifest entry raises a finding (T-US-TP-1).
    attempts: 1
