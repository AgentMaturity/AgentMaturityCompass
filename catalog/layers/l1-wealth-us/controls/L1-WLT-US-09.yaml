title: AI vendors tiered as third parties; a silent model change is detected
statement: Model vendors, agent platforms, tool providers and MCP servers are tiered third parties under due diligence
  and monitoring, and a vendor's silent model change is detected before more effects run.
riskRationale: Third-party guidance and the Safeguards Rule expect oversight of service providers; a vendor that swaps
  the model behind an endpoint changes the agent without review.
