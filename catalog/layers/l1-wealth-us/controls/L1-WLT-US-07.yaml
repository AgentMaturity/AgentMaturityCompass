binding:
  kind: enforcement_point
  points: [tool_pipeline]
  mechanism: Each agent has an auditor-signed agent.config.yaml naming its owner and purpose; a missing or edited entry
    fails verification. MFA for human access is outside AMC's runtime and is a reviewer check.
  parameters: []
  manualDuty: null
tests:
  - id: L1-WLT-US-07-T1
    type: configuration_check
    oracle:
      kind: signed_config
      observes: The auditor signature over agents/<id>/agent.config.yaml, verified by verifyAgentConfigSignature.
    fixtures:
      positive: [L1-WLT-US-07/positive/evidence-valid.json, L1-WLT-US-07/positive/signed-agent-entry.json]
      negative:
        - L1-WLT-US-07/negative/edited-agent-entry.json
        - L1-WLT-US-07/negative/unregistered-agent.json
        - L1-WLT-US-07/negative/evidence-contradictory.json
        - L1-WLT-US-07/negative/evidence-cross-tenant.json
        - L1-WLT-US-07/negative/evidence-empty.json
        - L1-WLT-US-07/negative/evidence-replayed.json
        - L1-WLT-US-07/negative/evidence-stale.json
        - L1-WLT-US-07/negative/evidence-violation.json
    passCriteria: An agent with a signed registry entry passes; a missing entry or one edited after signing fails (T-NY-2).
      The owner field, credential inventory and MFA for people are not checked by an executed test yet.
    attempts: 1
