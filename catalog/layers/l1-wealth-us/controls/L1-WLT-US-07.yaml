title: Agents and credentials inventoried with an owner; MFA for people
statement: Every agent and its credentials are in a signed asset inventory with a named owner, and every human access to
  the systems the agent touches uses multi-factor authentication.
riskRationale: An agent or credential missing from the inventory cannot be checked or revoked; the NYDFS AI letter reads
  the Part 500 inventory to include them.
