# Draft (P1-18): wealth.us.kill-switch. Experimental, agent-drafted and not independently reviewed; expert sign-off waits for D-08.
# Extends L0-MON-03 (Layer 0, P1-14) with the US finance parameter and citation.
# A result under this control is evidence of conformity, never proof of compliance.

id: L1-WLT-US-12
version: "0.1.0"
support: experimental
layer: 1
family: resilience
stations: [wealth]
title: Payment kill switch with manual fallback and no lost work
statement: An operator can stop an agent mid-workflow so that no new payment runs, with a manual fallback that takes
  over the in-flight work without losing it.
riskRationale: Stopping a payment agent must neither leave a half-done workflow nor lose the work queue. This extends
  L0-MON-03 with finance parameters.
mandatory: true
applicability:
  predicate: {always: true}
  reasons:
    - "The Wealth overlay applies to every US deployment in the Wealth station (pack scope: station wealth, jurisdiction
      US)."
  exclusions: []
citations: []
binding:
  kind: enforcement_point
  points: [tool_pipeline]
  mechanism: An operator stop refuses every new FINANCIAL call at the pipeline; in-flight executions stay journaled and
    are handed to the manual fallback (P2-26, not built yet).
  parameters: []
  manualDuty: null
tests:
  - id: L1-WLT-US-12-T1
    type: drill
    oracle:
      kind: enforcement_receipt
      observes: The first payment refused after the stop, the time to stop, and the journaled in-flight work handed to the
        manual fallback.
    fixtures:
      positive: [L1-WLT-US-12/positive/evidence-valid.json]
      negative:
        - L1-WLT-US-12/negative/evidence-contradictory.json
        - L1-WLT-US-12/negative/evidence-cross-tenant.json
        - L1-WLT-US-12/negative/evidence-empty.json
        - L1-WLT-US-12/negative/evidence-replayed.json
        - L1-WLT-US-12/negative/evidence-stale.json
        - L1-WLT-US-12/negative/evidence-violation.json
    passCriteria: "Signature test (P1-20): after the stop no payment runs, the drill records the time to stop, and every
      in-flight execution reaches the manual fallback with nothing lost."
    attempts: 1
evidence:
  - id: L1-WLT-US-12-E1
    producer: amc.killSwitch
    bindingFields: [deploymentId, controlId]
    freshness: {maxAgeDays: 90}
    sampling: {method: all, ratePercent: null, minItems: 1}
    retention: {mode: regime_max}
    residency: {mode: inherit_deployment}
invalidatedBy: [deployment_version, policy_version]
owner: {role: ciso}
clock: null
levels: [L2]
crosswalk: []
review: {status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null}
provenance: {draftedBy: ai, draftedAt: "2026-10-12", approvedBy: null}
