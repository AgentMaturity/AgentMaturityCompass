  - id: L1-WLT-US-05-T1
    type: drill
    oracle:
      kind: ledger_state
      observes: The monitor-signed clock events, the deadline computed from them and the store's refusals.
    fixtures:
      positive:
        - L1-WLT-US-05/positive/evidence-valid.json
        - L1-WLT-US-05/positive/sar-clock-from-detection.json
      negative:
        - L1-WLT-US-05/negative/backdated-detection.json
        - L1-WLT-US-05/negative/duplicate-sar-notice.json
        - L1-WLT-US-05/negative/notice-before-detection.json
        - L1-WLT-US-05/negative/evidence-contradictory.json
        - L1-WLT-US-05/negative/evidence-cross-tenant.json
        - L1-WLT-US-05/negative/evidence-empty.json
        - L1-WLT-US-05/negative/evidence-replayed.json
        - L1-WLT-US-05/negative/evidence-stale.json
        - L1-WLT-US-05/negative/evidence-violation.json
    passCriteria: Recording initial detection starts the SAR clock with its deadline 30 days later; a backdated detection, a
      notice before detection and a second notice are refused (T-US-AML-2, T-US-AML-3). The human approver and the
      five-year retention are not driven by this test.
