binding:
  kind: manual
  points: []
  mechanism: Recording initial detection on an incident starts the bsa-1020-320-sar-filing clock (P1-17); a named person
    approves each SAR draft before filing; the triage rationale is a retained record.
  parameters: []
  manualDuty:
    duty: Record initial detection, have a named person approve each SAR draft before filing, and keep the triage rationale
      for five years.
    ownerRole: senior_manager
    cadence: per detection
    evidenceOfPerformance: The signed clock events, the approval record and the retained rationale.
