title: "SAR workflow: a human approver and the 30-day clock from detection"
statement: A SAR draft records its human approver, the 30-day filing clock runs from initial detection, and the triage
  rationale is kept for five years.
riskRationale: A late SAR, one filed without a human decision, or a lost triage rationale cannot be defended to an examiner.
mandatory: true
