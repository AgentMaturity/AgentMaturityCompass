# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-INV-02
version: "0.1.0"
support: experimental
layer: 0
family: inventory-and-classification
stations: [education, environment, health, wealth, technology, mobility, governance]
title: AI bill of materials
statement: >-
  Each deployment has a CycloneDX AI bill of materials with the digests of its models, prompts, tools,
  datasets and policies, including the CERT-In AIBOM fields.
riskRationale: >-
  Without a component list and digests, nobody can tell which model, prompt or tool produced an effect
  or whether a vulnerable component is in use.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations:
  - key: us-cisa-sbom-2026
    registerId: us-cisa-sbom-2026
    instrument: CISA SBOM Minimum Elements v2.1 (2026)
    clause: Minimum elements (component name and version, supplier, component hash value and algorithm)
    edition: Final 2026 minimum elements published 2026-07-29
    jurisdiction: US
    statusType: voluntary-standard
    superseded: null
    effectiveDate: "2026-07-29"
    complianceDueDate: null
    dateNote: "Voluntary guidance: no compliance date."
    url: https://www.cisa.gov/sites/default/files/2026-07/2026_cisa_sbom_minimum_elements_508c.pdf
    retrieval:
      state: unverified
      reason: >-
        Not fetched in P1-14: the task allows no network access. Register entry us-cisa-sbom-2026 records
        the source as read in its review; fetch and hash this url before expert review (D-08).
    appliesWhen: { fact: jurisdictions, includesAny: [US] }
    legalReview: null
    note: >-
      Register: AI-specific fields are deferred to the G7 SBOM for AI minimum elements. The strategy's
      CERT-In AIBOM fields have no register entry or allowed host yet.
binding:
  kind: manual
  points: []
  mechanism: >-
    Each deployment release signs an AIBOM that lists every model, prompt, tool, dataset and policy with
    its digest.
  parameters: []
  manualDuty:
    duty: Produce and sign the deployment's AIBOM at every release.
    ownerRole: senior_manager
    cadence: every deployment release
    evidenceOfPerformance: The signed AIBOM attestation for the release.
tests:
  - id: L0-INV-02-T1
    type: configuration_check
    oracle: { kind: signed_config, observes: The signed AIBOM attestation and the digests it lists. }
    fixtures:
      positive: [L0-INV-02/positive/evidence-valid.json]
      negative:
        - L0-INV-02/negative/evidence-contradictory.json
        - L0-INV-02/negative/evidence-cross-tenant.json
        - L0-INV-02/negative/evidence-empty.json
        - L0-INV-02/negative/evidence-replayed.json
        - L0-INV-02/negative/evidence-stale.json
        - L0-INV-02/negative/evidence-violation.json
    passCriteria: >-
      The AIBOM verifies and lists a digest for every model, prompt, tool, dataset and policy in the
      deployment.
    attempts: 1
evidence:
  - id: L0-INV-02-E1
    producer: amc.aibom.attestation
    bindingFields: [deploymentId, controlId]
    freshness: { maxAgeDays: 90 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [model_version, prompt_version, tool_version, corpus_version, policy_version, deployment_version]
owner: { role: senior_manager }
clock: null
levels: [L2]
crosswalk:
  - framework: amc-audit-map-v1
    clause: SUPPLY_CHAIN_INTEGRITY.RELEASES
    relation: partial
    rationale: >-
      The audit map verifies release bundles; it does not require model, prompt or dataset digests.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
