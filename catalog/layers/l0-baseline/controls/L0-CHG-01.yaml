# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-CHG-01
version: "0.1.0"
support: experimental
layer: 0
family: change-control-and-validation
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Pinned versions
statement: >-
  Model, prompt, tool and corpus versions are pinned in a signed manifest, and an unpinned or changed
  component blocks activation until it is validated again.
riskRationale: >-
  An unpinned component can change behaviour under a deployment that was validated against something
  else.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: enforcement_point
  points: [tool_pipeline]
  mechanism: >-
    Activation compares the running components with the signed version manifest and refuses to start
    sessions when one is unpinned or differs.
  parameters: []
  manualDuty: null
tests:
  - id: L0-CHG-01-T1
    type: configuration_check
    oracle: { kind: signed_config, observes: The signed version manifest. }
    fixtures:
      positive: [L0-CHG-01/positive/evidence-valid.json]
      negative:
        - L0-CHG-01/negative/evidence-contradictory.json
        - L0-CHG-01/negative/evidence-cross-tenant.json
        - L0-CHG-01/negative/evidence-empty.json
        - L0-CHG-01/negative/evidence-replayed.json
        - L0-CHG-01/negative/evidence-stale.json
        - L0-CHG-01/negative/evidence-violation.json
    passCriteria: The manifest verifies and pins every model, prompt, tool and corpus.
    attempts: 1
  - id: L0-CHG-01-T2
    type: runtime_enforced
    oracle: { kind: enforcement_receipt, observes: The activation refusal for a changed component. }
    fixtures:
      positive: [L0-CHG-01/positive/evidence-valid-t2.json]
      negative: [L0-CHG-01/negative/evidence-violation-t2.json]
    passCriteria: >-
      A changed component blocks activation. Today only the compiled plan and catalog lock are pinned.
    attempts: 1
evidence:
  - id: L0-CHG-01-E1
    producer: amc.versionManifest
    bindingFields: [deploymentId, controlId]
    freshness: { maxAgeDays: 90 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [model_version, prompt_version, tool_version, corpus_version]
owner: { role: head_of_qa }
clock: null
levels: [L2]
crosswalk:
  - framework: amc-audit-map-v1
    clause: CHANGE_MANAGEMENT.POLICY_SIGNING
    relation: partial
    rationale: >-
      Signed policies are related; models, prompts and corpora are not covered.
  - framework: amc-audit-map-v1
    clause: CHANGE_MANAGEMENT.RELEASE_MANIFESTS
    relation: partial
    rationale: >-
      Signed release manifests are related; they do not pin model and prompt versions.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
