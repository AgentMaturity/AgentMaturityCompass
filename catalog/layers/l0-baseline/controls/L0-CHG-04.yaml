# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-CHG-04
version: "0.1.0"
support: experimental
layer: 0
family: change-control-and-validation
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Vendor change notice
statement: >-
  Model and tool vendor change notices are tracked and trigger revalidation, and a notice unhandled
  past its deadline raises a finding.
riskRationale: >-
  A vendor can change a model or tool under a stable name; an untracked notice leaves the deployment
  running on something nobody validated.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations:
  - key: eu-dora-art-28
    registerId: eu-dora
    instrument: Digital Operational Resilience Act, Regulation (EU) 2022/2554
    clause: Art. 28
    edition: Regulation (EU) 2022/2554 (CELEX 32022R2554)
    jurisdiction: EU
    statusType: binding-now
    superseded: null
    effectiveDate: "2025-01-17"
