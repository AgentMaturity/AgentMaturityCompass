      state: unverified
      reason: >-
        Not fetched in P1-14: the task allows no network access. Register entry eu-dora records the source
        as read in its review; fetch and hash this url before expert review (D-08).
    appliesWhen:
      all: [{ fact: jurisdictions, includesAny: [EU] }, { fact: entityTypes, includesAny: [eu_financial_entity] }]
    legalReview: null
    note: >-
      Register: general principles of ICT third-party risk management, including model and agent-platform
      providers. The legal reviewer pins the exit-strategy paragraph.
