binding:
  kind: enforcement_point
  points: [tool_pipeline, approvals]
  mechanism: >-
    The native toolset records every tool outcome, allowed, denied or failed, as ledger rows in the
    session's hash chain.
  parameters: []
  manualDuty: null
tests:
  - id: L0-LOG-01-T1
    type: runtime_enforced
    oracle: { kind: ledger_state, observes: Ledger rows for each call and the chain verification result. }
    fixtures:
      positive:
        - L0-LOG-01/positive/allowed-call-traced.json
        - L0-LOG-01/positive/denied-call-traced.json
        - L0-LOG-01/positive/evidence-valid.json
        - L0-LOG-01/positive/writerless-ledger-session.json
      negative:
        - L0-LOG-01/negative/evidence-contradictory.json
        - L0-LOG-01/negative/evidence-cross-tenant.json
        - L0-LOG-01/negative/evidence-empty.json
        - L0-LOG-01/negative/evidence-replayed.json
        - L0-LOG-01/negative/evidence-stale.json
        - L0-LOG-01/negative/evidence-violation.json
        - L0-LOG-01/negative/writerless-unopened-session.json
    passCriteria: >-
      An allowed and a denied call each leave ledger rows naming the session, agent and tool, and the
      chain verifies, whether the session writer records them or a writer-less toolset records into a
      session the ledger holds open. A writer-less toolset whose session the ledger does not hold refuses
      the call and writes no row (UNVERIFIABLE_TOOL_EVIDENCE), so the chain still verifies.
    attempts: 1
evidence:
  - id: L0-LOG-01-E1
    producer: amc.ledger
    bindingFields: [workspaceId, agentId, sessionId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [deployment_version, policy_version]
owner: { role: ciso }
clock: null
levels: [L2, L3]
crosswalk:
  - framework: amc-audit-map-v1
    clause: LOGGING_MONITORING.LEDGER_CHAIN
    relation: partial
    rationale: >-
      The audit map checks hash-chain continuity; it does not check that every step is recorded.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
