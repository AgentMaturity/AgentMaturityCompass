id: L0-LOG-01
version: "0.1.0"
support: experimental
layer: 0
family: logging-and-retention
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Step-level traces
statement: >-
  Every model call, tool call, approval and refusal is a hash-chained ledger event bound to its
  session, agent and deployment.
riskRationale: >-
  Without a step-level trace nobody can reconstruct what the agent did, in what order, or on whose
  authority.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations:
  - key: hipaa-164-312-b
    registerId: null
    instrument: HIPAA Security Rule, technical safeguards
    clause: "45 CFR 164.312(b) audit controls"
    edition: CFR 2024 annual edition, Title 45 Vol. 2 (GPO)
    jurisdiction: US
    statusType: binding-now
    superseded: null
    effectiveDate: null
    complianceDueDate: null
    dateNote: >-
      Not recorded: the legal review (D-08) pins the effective and compliance dates.
    url: https://www.govinfo.gov/content/pkg/CFR-2024-title45-vol2/xml/CFR-2024-title45-vol2-sec164-312.xml
    retrieval:
      state: unverified
      reason: >-
        Not fetched in P1-14: the task allows no network access. Source named by the strategy as quoted in
        the P1-14 spec; fetch, hash and pin the paragraph before expert review (D-08).
    appliesWhen:
      all:
        - { fact: jurisdictions, includesAny: [US] }
