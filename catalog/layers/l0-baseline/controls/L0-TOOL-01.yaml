# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-TOOL-01
version: "0.1.0"
support: experimental
layer: 0
family: least-privilege-and-tools
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Signed tool allowlist
statement: >-
  Only tools in the signed tools configuration are visible to the agent, and any other call is refused
  with a receipt.
riskRationale: >-
  An agent that can reach unlisted tools has whatever authority those tools carry, outside any signed
  policy.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: enforcement_point
  points: [tool_pipeline]
  mechanism: >-
    The tool-allowlist guard reads .amc/tools.yaml and its auditor signature in one read and refuses any
    tool the verified configuration does not list, and every tool when it does not verify.
  parameters: []
  manualDuty: null
tests:
  - id: L0-TOOL-01-T1
    type: runtime_enforced
    oracle:
      kind: enforcement_receipt
      observes: >-
        The guard denial, the TOOL_CALL_DENIED record and the signed action_state receipt; the agent's reply
        is never read.
    fixtures:
      positive: [L0-TOOL-01/positive/evidence-valid.json, L0-TOOL-01/positive/listed-tool.json]
      negative:
        - L0-TOOL-01/negative/edited-config.json
        - L0-TOOL-01/negative/evidence-contradictory.json
        - L0-TOOL-01/negative/evidence-cross-tenant.json
        - L0-TOOL-01/negative/evidence-empty.json
        - L0-TOOL-01/negative/evidence-replayed.json
        - L0-TOOL-01/negative/evidence-stale.json
        - L0-TOOL-01/negative/evidence-violation.json
        - L0-TOOL-01/negative/foreign-signature.json
        - L0-TOOL-01/negative/signature-removed.json
        - L0-TOOL-01/negative/unlisted-tool.json
    passCriteria: >-
      A listed tool runs; an unlisted tool, an edited configuration, a missing signature and a foreign
      signature are refused by the tool-allowlist guard with a denied receipt and no tool body run.
    attempts: 1
evidence:
  - id: L0-TOOL-01-E1
    producer: amc.toolPipeline.guard
    bindingFields: [workspaceId, agentId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
  - id: L0-TOOL-01-E2
    producer: amc.signedConfig.tools
    bindingFields: [workspaceId, controlId]
    freshness: { maxAgeDays: 90 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [tool_version, policy_version, deployment_version]
owner: { role: ciso }
clock: null
levels: [L2, L3]
crosswalk:
  - framework: amc-audit-map-v1
    clause: SECURE_CONFIGURATION.TOOLS_POLICY
    relation: partial
    rationale: >-
      The audit map checks that the tools policy is signed; it does not check per-call refusal.
  - framework: amc-audit-map-v1
    clause: MODEL_TOOL_GOVERNANCE.TOOL_BOUNDARY
    relation: partial
    rationale: >-
      Denied tools are blocked and audited; the audit map does not require a signed receipt per refusal.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
