# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-TOOL-04
version: "0.1.0"
support: experimental
layer: 0
family: least-privilege-and-tools
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Default-deny network egress
statement: >-
  Tool network access is denied unless the destination is on the deployment allowlist, and every
  blocked attempt is recorded.
riskRationale: >-
  Open egress lets an injected instruction send data to any host and fetch further instructions from
  it.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: enforcement_point
  points: [tool_pipeline, egress]
  mechanism: >-
    The network-egress guard refuses a NETWORK_EXTERNAL call whose host is not on its tool's signed host
    allowlist; the gateway proxy writes NETWORK_EGRESS_BLOCKED for refused proxy traffic.
  parameters: []
  manualDuty: null
tests:
  - id: L0-TOOL-04-T1
    type: runtime_enforced
    oracle:
      kind: enforcement_receipt
      observes: >-
        The guard denial, the TOOL_CALL_DENIED record and the signed action_state receipt.
    fixtures:
      positive: [L0-TOOL-04/positive/allowlisted-host.json, L0-TOOL-04/positive/evidence-valid.json]
      negative:
        - L0-TOOL-04/negative/evidence-contradictory.json
        - L0-TOOL-04/negative/evidence-cross-tenant.json
        - L0-TOOL-04/negative/evidence-empty.json
        - L0-TOOL-04/negative/evidence-replayed.json
        - L0-TOOL-04/negative/evidence-stale.json
        - L0-TOOL-04/negative/evidence-violation.json
        - L0-TOOL-04/negative/no-url.json
        - L0-TOOL-04/negative/unlisted-host.json
        - L0-TOOL-04/negative/unparseable-url.json
        - L0-TOOL-04/negative/userinfo-host.json
    passCriteria: >-
      An allowlisted host is reached; an unlisted host, an unparseable url and a call naming no url are
      refused by the network-egress guard with a denied receipt and no tool body run.
    attempts: 1
evidence:
  - id: L0-TOOL-04-E1
    producer: amc.toolPipeline.guard
    bindingFields: [workspaceId, agentId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
  - id: L0-TOOL-04-E2
    producer: amc.gateway.egress
    bindingFields: [workspaceId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [tool_version, policy_version, deployment_version]
owner: { role: ciso }
clock: null
levels: [L2, L3]
crosswalk:
  - framework: amc-audit-map-v1
    clause: MODEL_TOOL_GOVERNANCE.TOOL_BOUNDARY
    relation: partial
    rationale: >-
      Denied tools are blocked and audited; the audit map does not check host allowlists.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
