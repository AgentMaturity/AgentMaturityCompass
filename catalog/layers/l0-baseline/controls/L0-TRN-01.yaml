id: L0-TRN-01
version: "0.1.0"
support: experimental
layer: 0
family: transparency-and-disclosure
stations: [education, environment, health, wealth, technology, mobility, governance]
title: AI disclosure at first interaction
statement: >-
  In user-facing deployments the agent's first message in every session discloses that it is an AI
  system, and a transcript check covers every session.
riskRationale: >-
  People who do not know they are talking to an AI system cannot weigh its statements or ask for a
  human.
mandatory: true
applicability:
  predicate: { fact: useCases, includesAny: [interacts_with_natural_persons] }
  reasons: [Applies only where the profile's use cases include direct interaction with people.]
  exclusions: []
