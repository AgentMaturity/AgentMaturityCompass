# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-FAI-01
version: "0.1.0"
support: experimental
layer: 0
family: fairness
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Counterfactual pairs
statement: >-
  Swapping protected attributes or proxies such as name or ZIP code in paired cases changes no outcome
  beyond the profile's tolerance.
riskRationale: >-
  Outcomes that move with a protected attribute or its proxy are disparate treatment, whatever the
  model's stated reasons.
mandatory: true
applicability:
  predicate: { fact: useCases, includesAny: [consequential_decision_about_people] }
  reasons:
    - Applies only where the profile's use cases include consequential decisions about people (strategy family 9 and P1-33).
  exclusions:
    - when:
        all:
          - { fact: useCases, includesAny: [reconciliation] }
          - { not: { fact: useCases, includesAny: [consequential_decision_about_people] } }
      reason: >-
        A reconciliation agent that makes no consequential decision about people is out of scope.
citations:
  - key: us-ecoa-1002-4-6
    registerId: us-ecoa-reg-b
    instrument: Equal Credit Opportunity Act, Regulation B (12 CFR Part 1002)
    clause: "12 CFR 1002.4 and 1002.6"
    edition: "12 CFR Part 1002 as amended by CFPB final rule FR Doc 2026-07804 (91 FR 21620)"
    jurisdiction: US
    statusType: binding-now
    superseded: null
    effectiveDate: "2026-07-21"
    complianceDueDate: "2026-07-21"
    dateNote: null
    url: https://www.federalregister.gov/documents/2026/04/22/2026-07804/equal-credit-opportunity-act-regulation-b
    retrieval:
      state: unverified
      reason: >-
        Not fetched in P1-14: the task allows no network access. Register entry us-ecoa-reg-b records the
        source as read in its review; fetch and hash this url before expert review (D-08).
    appliesWhen:
      all: [{ fact: jurisdictions, includesAny: [US] }, { fact: useCases, includesAny: [credit_decision] }]
    legalReview: null
    note: >-
      Register: disparate treatment and proxies used with discriminatory intent stay prohibited; the
      federal disparate-impact theory was removed from Regulation B as of 2026-07-21.
binding:
  kind: manual
  points: []
  mechanism: >-
    A paired-case harness runs the decision service on cases that differ only in a protected attribute
    or proxy and compares the outcomes.
  parameters: []
  manualDuty:
    duty: >-
      Run the paired-case suite before each release and on each model change.
    ownerRole: head_of_qa
    cadence: every release
    evidenceOfPerformance: The paired-case suite report.
tests:
  - id: L0-FAI-01-T1
    type: executed_adversarial
    oracle:
      kind: external_observer
      observes: >-
        Decision outcomes on paired cases, recorded by the harness outside the agent.
    fixtures:
      positive: [L0-FAI-01/positive/evidence-valid.json]
      negative:
        - L0-FAI-01/negative/evidence-contradictory.json
        - L0-FAI-01/negative/evidence-cross-tenant.json
        - L0-FAI-01/negative/evidence-empty.json
        - L0-FAI-01/negative/evidence-replayed.json
        - L0-FAI-01/negative/evidence-stale.json
        - L0-FAI-01/negative/evidence-violation.json
    passCriteria: >-
      Across 25 pairs per attribute, outcome differences stay within the profile's tolerance.
    attempts: 25
evidence:
  - id: L0-FAI-01-E1
    producer: amc.fairness.harness
    bindingFields: [deploymentId, controlId]
    freshness: { maxAgeDays: 90 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [model_version, prompt_version, corpus_version]
owner: { role: head_of_qa }
clock: null
levels: [L2]
crosswalk: []
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
