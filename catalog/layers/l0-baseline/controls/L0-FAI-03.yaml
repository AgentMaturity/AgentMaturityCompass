      state: unverified
      reason: >-
        Not fetched in P1-14: the task allows no network access. Register entry us-ca-crd-ads records the
        source as read in its review; fetch and hash this url before expert review (D-08).
    appliesWhen:
      all: [{ fact: jurisdictions, includesAny: [US-CA] }, { fact: useCases, includesAny: [employment_decision] }]
    legalReview: null
    note: >-
      Register: ADS use that harms applicants or employees on protected characteristics may violate FEHA;
      the rules define proxy.
binding:
  kind: manual
  points: []
  mechanism: >-
    Each decision input is screened for proxy risk; a flagged input is removed or kept with a signed
    justification.
  parameters: []
  manualDuty:
    duty: >-
      Screen inputs on each model or feature change and sign each justification.
    ownerRole: head_of_qa
    cadence: on every model or feature change
    evidenceOfPerformance: The screening report and signed justifications.
tests:
  - id: L0-FAI-03-T1
    type: configuration_check
    oracle: { kind: signed_config, observes: The signed input list with proxy flags and justifications. }
    fixtures:
      positive: [L0-FAI-03/positive/evidence-valid.json]
      negative:
        - L0-FAI-03/negative/evidence-contradictory.json
        - L0-FAI-03/negative/evidence-cross-tenant.json
        - L0-FAI-03/negative/evidence-empty.json
        - L0-FAI-03/negative/evidence-replayed.json
        - L0-FAI-03/negative/evidence-stale.json
        - L0-FAI-03/negative/evidence-violation.json
    passCriteria: Every flagged input is blocked or has a signed justification.
    attempts: 1
  - id: L0-FAI-03-T2
    type: document_review
    oracle: { kind: human_assessor, observes: The screening method and its results. }
    fixtures:
      positive: [L0-FAI-03/positive/evidence-valid-t2.json]
      negative: [L0-FAI-03/negative/evidence-violation-t2.json]
    passCriteria: The screening covers every input and its method is stated.
    attempts: 1
