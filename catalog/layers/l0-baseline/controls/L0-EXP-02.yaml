binding:
  kind: manual
  points: []
  mechanism: >-
    Each consequential decision emits a notice built from the overlay's element list; the notice is
    checked against that list before it is sent.
  parameters: []
  manualDuty:
    duty: Keep the notice template aligned with every applicable overlay.
    ownerRole: senior_manager
    cadence: on every overlay change
    evidenceOfPerformance: The notice template and its element check.
tests:
  - id: L0-EXP-02-T1
    type: document_review
    oracle: { kind: human_assessor, observes: Sampled notices against the overlay's element list. }
    fixtures:
      positive: [L0-EXP-02/positive/evidence-valid.json]
      negative:
        - L0-EXP-02/negative/evidence-contradictory.json
        - L0-EXP-02/negative/evidence-cross-tenant.json
        - L0-EXP-02/negative/evidence-empty.json
        - L0-EXP-02/negative/evidence-replayed.json
        - L0-EXP-02/negative/evidence-stale.json
        - L0-EXP-02/negative/evidence-violation.json
    passCriteria: Every sampled notice carries every required element.
    attempts: 1
  - id: L0-EXP-02-T2
    type: configuration_check
    oracle: { kind: signed_config, observes: The signed notice template and the overlay element list it covers. }
