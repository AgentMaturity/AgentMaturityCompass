# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-FAI-04
version: "0.1.0"
support: experimental
layer: 0
family: fairness
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Subgroup performance
statement: >-
  Error rates are reported per subgroup with sample sizes, and a gap beyond the profile tolerance
  opens a finding.
riskRationale: >-
  An average error rate can hide a subgroup for whom the system fails far more often.
mandatory: true
applicability:
  predicate: { fact: useCases, includesAny: [consequential_decision_about_people] }
  reasons:
    - Applies only where the profile's use cases include consequential decisions about people (strategy family 9 and P1-33).
  exclusions:
    - when:
        all:
          - { fact: useCases, includesAny: [reconciliation] }
          - { not: { fact: useCases, includesAny: [consequential_decision_about_people] } }
      reason: >-
        A reconciliation agent that makes no consequential decision about people is out of scope.
citations: []
binding:
  kind: manual
  points: []
  mechanism: >-
    Error rates per subgroup are computed with sample sizes and compared with the tolerance; a gap opens
    a finding.
  parameters: []
  manualDuty:
    duty: Report subgroup error rates and track findings to closure.
    ownerRole: head_of_qa
    cadence: quarterly
    evidenceOfPerformance: The subgroup report and the finding log.
tests:
  - id: L0-FAI-04-T1
    type: document_review
    oracle: { kind: human_assessor, observes: "The subgroup report, sample sizes and findings." }
    fixtures:
      positive: [L0-FAI-04/positive/evidence-valid.json]
      negative:
        - L0-FAI-04/negative/evidence-contradictory.json
        - L0-FAI-04/negative/evidence-cross-tenant.json
        - L0-FAI-04/negative/evidence-empty.json
        - L0-FAI-04/negative/evidence-replayed.json
        - L0-FAI-04/negative/evidence-stale.json
        - L0-FAI-04/negative/evidence-violation.json
    passCriteria: >-
      Every subgroup is reported with its sample size and every gap beyond tolerance has a finding.
    attempts: 1
evidence:
  - id: L0-FAI-04-E1
    producer: amc.fairness.harness
    bindingFields: [deploymentId, controlId]
    freshness: { maxAgeDays: 120 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [model_version, corpus_version]
owner: { role: head_of_qa }
clock: null
levels: [L2]
crosswalk: []
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
