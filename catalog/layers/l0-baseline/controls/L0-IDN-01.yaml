    instrument: HIPAA Security Rule, technical safeguards
    clause: "45 CFR 164.312(a)(1) access control; 164.312(b) audit controls"
    edition: "CFR 2024 annual edition, Title 45 Vol. 2 (GPO)"
    jurisdiction: US
    statusType: binding-now
    superseded: null
    effectiveDate: null
    complianceDueDate: null
    dateNote: "Not recorded: the legal review (D-08) pins the effective and compliance dates."
