# Agent-drafted, experimental: HIPAA and GLBA applicability and paragraph pins need the legal reviewer (D-08).
id: L0-IDN-01
version: 0.1.0
support: experimental
layer: 0
family: identity-and-delegation
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Unique agent identity bound to a human principal
statement: >-
  Every tool call is attributed at the enforcement point to a unique agent
  identity and to the human principal the agent acts for, and a call with no
  resolvable identity or principal is refused.
riskRationale: >-
  Shared or missing identities make effects unattributable, so nobody can
  review, revoke or reconstruct which agent or person caused them.
mandatory: true
applicability:
  predicate: { always: true }
  reasons:
    - Layer 0 applies to every agent deployment in every station.
  exclusions: []
