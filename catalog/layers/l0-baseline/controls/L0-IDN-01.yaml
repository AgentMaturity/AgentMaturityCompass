binding:
  kind: enforcement_point
  points: [tool_pipeline]
  mechanism: >-
    A tool-pipeline guard denies any call whose lease is missing, expired,
    revoked or issued for another workspace, or whose authorization record
    names no principal, before the tool body runs.
  parameters:
    - { name: toolPipeline.requireAgentLease, value: true, strictness: true_wins }
    - { name: toolPipeline.requirePrincipal, value: true, strictness: true_wins }
  manualDuty: null
tests:
  - id: L0-IDN-01-T1
    type: runtime_enforced
    oracle:
      kind: enforcement_receipt
      observes: The guard decision and the ledger row it writes; the agent's reply is never read.
    fixtures:
      positive:
        - L0-IDN-01/positive/lease-and-principal.json
      negative:
        - L0-IDN-01/negative/no-lease.json
        - L0-IDN-01/negative/expired-lease.json
        - L0-IDN-01/negative/other-workspace-lease.json
        - L0-IDN-01/negative/no-principal.json
        - L0-IDN-01/negative/replayed-authorization.json
        - L0-IDN-01/negative/contradictory-receipts.json
        - L0-IDN-01/negative/empty-window.json
    passCriteria: >-
      Guard fixtures are denied with IDENTITY_UNRESOLVED or PRINCIPAL_UNRESOLVED
      and no tool body runs; the contradictory and empty evidence fixtures give
      not_evaluated; the positive fixture is allowed and its receipt names
      agentId and principalId.
    attempts: 1
evidence:
  - id: L0-IDN-01-E1
    producer: amc.authorizationRecord
    bindingFields: [tenantId, workspaceId, deploymentId, agentId, principalId, sessionId, controlId, controlVersion, policyDigest]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
  - id: L0-IDN-01-E2
    producer: amc.leases.issuer
    bindingFields: [workspaceId, agentId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [tool_version, policy_version, deployment_version]
owner: { role: ciso }
clock: null
levels: [L2, L3]
crosswalk:
  - framework: amc-audit-map-v1
    clause: ACCESS_CONTROL.LEASE_SCOPING
    relation: partial
    rationale: >-
      The audit-map control checks that leases are workspace-scoped; it does
      not check that each call names a human principal.
