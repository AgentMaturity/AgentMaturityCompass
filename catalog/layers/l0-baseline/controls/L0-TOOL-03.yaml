# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-TOOL-03
version: "0.1.0"
support: experimental
layer: 0
family: least-privilege-and-tools
stations: [education, environment, health, wealth, technology, mobility, governance]
title: MCP server authorization
statement: >-
  Remote MCP servers are used only with authorization per the MCP 2026-07-28 specification, and an
  unauthenticated or unpinned server is refused.
riskRationale: >-
  An unpinned or unauthenticated MCP server can impersonate a tool provider and feed the agent
  instructions or exfiltrate its data.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: enforcement_point
  points: [tool_pipeline, egress]
  mechanism: >-
    The MCP client pins each remote server's exact origin and configuration digest and refuses a server
    without completed authorization before any tool is listed.
  parameters: []
  manualDuty: null
tests:
  - id: L0-TOOL-03-T1
    type: runtime_enforced
    oracle:
      kind: enforcement_receipt
      observes: The MCP client's refusal for an unpinned or unauthenticated server.
    fixtures:
      positive: [L0-TOOL-03/positive/evidence-valid.json]
      negative:
        - L0-TOOL-03/negative/evidence-contradictory.json
        - L0-TOOL-03/negative/evidence-cross-tenant.json
        - L0-TOOL-03/negative/evidence-empty.json
        - L0-TOOL-03/negative/evidence-replayed.json
        - L0-TOOL-03/negative/evidence-stale.json
        - L0-TOOL-03/negative/evidence-violation.json
    passCriteria: >-
      A pinned, authorized server is used; an unpinned origin, a changed configuration digest and an
      unauthenticated server are refused. Today unpinned origins are refused at load, but an
      unauthenticated server is refused only after it answers 401.
    attempts: 1
evidence:
  - id: L0-TOOL-03-E1
    producer: amc.mcp.authorization
    bindingFields: [workspaceId, agentId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [tool_version, policy_version, deployment_version]
owner: { role: ciso }
clock: null
levels: [L2]
crosswalk: []
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
