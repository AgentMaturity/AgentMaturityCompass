binding:
  kind: enforcement_point
  points: [egress]
  mechanism: >-
    The signed processor registry binds each model route to one processor and purpose; protected data on
    a route without a listed processor and a covering contract is refused, and PHI needs a BAA.
  parameters: []
  manualDuty: null
