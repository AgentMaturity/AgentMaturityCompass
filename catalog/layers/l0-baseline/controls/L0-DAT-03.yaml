id: L0-DAT-03
version: "0.1.0"
support: experimental
layer: 0
family: data-protection
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Processor allowlist
statement: >-
  Protected data goes only to processors on the deployment allowlist, for HIPAA only to endpoints
  under a business associate agreement, and every other destination is blocked.
riskRationale: >-
  Sending protected data to an unlisted processor creates a disclosure the operator cannot account for
  or contract against.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
