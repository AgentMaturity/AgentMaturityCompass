# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-LOG-03
version: "0.1.0"
support: experimental
layer: 0
family: logging-and-retention
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Retention per regime
statement: >-
  Each record class is kept for the longest applicable regime, such as six months for AI Act deployer
  logs and 180 days for CERT-In logs, and deletion under an unknown hold is refused.
riskRationale: >-
  Deleting a record a regime or a hold still requires destroys evidence the operator is obliged to
  keep.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations:
  - key: eu-ai-act-art-26-6
    registerId: eu-ai-act
    instrument: Artificial Intelligence Act, Regulation (EU) 2024/1689
    clause: Art. 26(6)
    edition: Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744 (CELEX 32024R1689, 32026R1744)
    jurisdiction: EU
    statusType: binding-now
    superseded: null
    effectiveDate: "2024-08-01"
    complianceDueDate: "2027-12-02"
    dateNote: null
    url: https://publications.europa.eu/resource/celex/32024R1689
    retrieval:
      state: unverified
      reason: >-
        Not fetched in P1-14: the task allows no network access. Register entry eu-ai-act records the source
        as read in its review; fetch and hash this url before expert review (D-08).
    appliesWhen:
      all: [{ fact: jurisdictions, includesAny: [EU] }, { fact: roles, includesAny: [deployer] }]
    legalReview: null
    note: >-
      Strategy: deployer logs are kept for at least six months. The register lists Art. 26 without the
      paragraph; the legal reviewer confirms 26(6).
binding:
  kind: enforcement_point
  points: [deletion_executor]
  mechanism: >-
    The deletion gate checks the signed legal-hold registry before each deletion and refuses deletion
    when a hold applies or the hold state cannot be established.
  parameters: []
  manualDuty: null
tests:
  - id: L0-LOG-03-T1
    type: configuration_check
    oracle: { kind: enforcement_receipt, observes: The deletion gate's verdict and its audit row. }
    fixtures:
      positive: [L0-LOG-03/positive/evidence-valid.json, L0-LOG-03/positive/no-hold.json]
      negative:
        - L0-LOG-03/negative/active-hold.json
        - L0-LOG-03/negative/corrupt-hold-record.json
        - L0-LOG-03/negative/evidence-contradictory.json
        - L0-LOG-03/negative/evidence-cross-tenant.json
        - L0-LOG-03/negative/evidence-empty.json
        - L0-LOG-03/negative/evidence-replayed.json
        - L0-LOG-03/negative/evidence-stale.json
        - L0-LOG-03/negative/evidence-violation.json
    passCriteria: >-
      Deletion with no hold proceeds; deletion under an active hold and under an unknown hold state is
      refused. Regime-specific retention periods are not built yet (P2-26).
    attempts: 1
evidence:
  - id: L0-LOG-03-E1
    producer: amc.residency.deletionGate
    bindingFields: [workspaceId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [policy_version, deployment_version]
owner: { role: ciso }
clock: null
levels: [L2, L3]
crosswalk:
  - framework: amc-audit-map-v1
    clause: INCIDENT_RESPONSE_PREPAREDNESS.RETENTION
    relation: partial
    rationale: >-
      The audit map checks that retention runs; it does not check regime periods or holds.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
