# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-CHG-03
version: "0.1.0"
support: experimental
layer: 0
family: change-control-and-validation
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Evidence invalidated on change
statement: >-
  A new model, prompt, tool, policy or deployment version voids earlier evidence for the affected
  controls until they are evidenced again.
riskRationale: >-
  Evidence gathered on an earlier version says nothing about the version now running.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: manual
  points: []
  mechanism: >-
    Version changes are recorded as invalidation triggers; the evidence evaluator rejects items recorded
    before a trigger for every control that lists it.
  parameters: []
  manualDuty:
    duty: >-
      Record each version change as an invalidation trigger and re-run the affected tests.
    ownerRole: head_of_qa
    cadence: on every version change
    evidenceOfPerformance: The trigger log and the re-run results.
tests:
  - id: L0-CHG-03-T1
    type: runtime_enforced
    oracle: { kind: ledger_state, observes: The evaluator's rejections after a recorded version change. }
    fixtures:
      positive: [L0-CHG-03/positive/evidence-valid.json]
      negative:
        - L0-CHG-03/negative/evidence-contradictory.json
        - L0-CHG-03/negative/evidence-cross-tenant.json
        - L0-CHG-03/negative/evidence-empty.json
        - L0-CHG-03/negative/evidence-replayed.json
        - L0-CHG-03/negative/evidence-stale.json
        - L0-CHG-03/negative/evidence-violation.json
    passCriteria: >-
      Items recorded before a trigger are rejected as invalidated. The evaluator applies triggers it is
      given; nothing records them from version changes yet.
    attempts: 1
evidence:
  - id: L0-CHG-03-E1
    producer: amc.versionManifest
    bindingFields: [deploymentId, controlId]
    freshness: { maxAgeDays: 90 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [model_version, prompt_version, tool_version, policy_version, deployment_version]
owner: { role: head_of_qa }
clock: null
levels: [L2]
crosswalk: []
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
