title: EU role and Art. 6(3) record
statement: >-
  Where an EU overlay applies, the provider or deployer role and any Art. 6(3) exemption exist as
  signed artifacts, and without them EU controls are not evaluated.
riskRationale: >-
  EU duties differ by role and by whether the Art. 6(3) exemption applies; a flag nobody signed lets
  an operator pick the lighter set.
