binding:
  kind: manual
  points: []
  mechanism: >-
    Recording an incident starts its clocks from the F4 table; signed clock events record triggers and
    notices; a draft notice is prepared before each deadline.
  parameters: []
  manualDuty:
    duty: >-
      Record incident triggers and notices and prepare each notice before its deadline.
    ownerRole: ciso
    cadence: per incident
    evidenceOfPerformance: The signed clock events and the notice drafts.
tests:
  - id: L0-MON-02-T1
    type: drill
    oracle: { kind: ledger_state, observes: The clocks attached to a drill incident and the signed clock events. }
    fixtures:
      positive: [L0-MON-02/positive/clocks-start.json, L0-MON-02/positive/evidence-valid.json]
      negative:
        - L0-MON-02/negative/evidence-contradictory.json
        - L0-MON-02/negative/evidence-cross-tenant.json
        - L0-MON-02/negative/evidence-empty.json
        - L0-MON-02/negative/evidence-replayed.json
        - L0-MON-02/negative/evidence-stale.json
        - L0-MON-02/negative/evidence-violation.json
    passCriteria: >-
      Every applicable clock starts with its deadline and each notice is recorded before it.
    attempts: 1
  - id: L0-MON-02-T2
    type: runtime_enforced
    oracle: { kind: ledger_state, observes: The clock events store's refusals. }
    fixtures:
      positive: [L0-MON-02/positive/evidence-valid-t2.json, L0-MON-02/positive/notice-recorded.json]
      negative:
        - L0-MON-02/negative/backdated-notice.json
        - L0-MON-02/negative/duplicate-notice.json
        - L0-MON-02/negative/evidence-violation-t2.json
        - L0-MON-02/negative/future-dated-notice.json
        - L0-MON-02/negative/unknown-clock.json
    passCriteria: >-
      Backdated, future-dated and unknown clock events are refused. Notice drafts are not built yet
      (P2-26).
    attempts: 1
