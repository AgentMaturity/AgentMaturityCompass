id: L0-MON-02
version: "0.1.0"
support: experimental
layer: 0
family: monitoring-incidents-and-resilience
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Incidents start regulatory clocks
statement: >-
  A detected incident starts every applicable regulatory clock with its deadline, and notice drafts
  exist before each deadline.
riskRationale: >-
  A reporting deadline that nobody started counting is missed by default.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
