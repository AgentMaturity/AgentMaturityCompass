# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-FAI-02
version: "0.1.0"
support: experimental
layer: 0
family: fairness
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Impact ratios
statement: >-
  Selection-rate impact ratios per group are computed on test or production samples and reported
  against the profile threshold.
riskRationale: >-
  Without measured impact ratios, a disparity in outcomes stays invisible until someone affected finds
  it.
mandatory: true
applicability:
  predicate: { fact: useCases, includesAny: [consequential_decision_about_people] }
  reasons:
    - Applies only where the profile's use cases include consequential decisions about people (strategy family 9 and P1-33).
  exclusions:
    - when:
        all:
          - { fact: useCases, includesAny: [reconciliation] }
          - { not: { fact: useCases, includesAny: [consequential_decision_about_people] } }
      reason: >-
        A reconciliation agent that makes no consequential decision about people is out of scope.
citations:
  - key: us-nyc-ll144
    registerId: us-nyc-ll144
    instrument: NYC Local Law 144 of 2021 and DCWP rules
    clause: "Bias audit duty for automated employment decision tools (register ref LL 144 #1); section numbers to be pinned by the legal reviewer"
    edition: Local Law 144 of 2021 with DCWP rules, enforced from 2023-07-05
    jurisdiction: US-NYC
    statusType: binding-now
    superseded: null
    effectiveDate: "2023-07-05"
    complianceDueDate: "2023-07-05"
    dateNote: null
    url: https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page
    retrieval:
      state: unverified
      reason: >-
        Not fetched in P1-14: the task allows no network access. Register entry us-nyc-ll144 records the
        source as read in its review; fetch and hash this url before expert review (D-08).
    appliesWhen:
      all: [{ fact: jurisdictions, includesAny: [US-NYC] }, { fact: useCases, includesAny: [employment_decision] }]
    legalReview: null
    note: >-
      Register: an annual independent bias audit, a public audit summary and candidate notice before use.
binding:
  kind: manual
  points: []
  mechanism: >-
    Impact ratios per group are computed from recorded outcomes and compared with the profile threshold.
  parameters: []
  manualDuty:
    duty: Compute and publish impact ratios on the profile's cadence.
    ownerRole: head_of_qa
    cadence: quarterly
    evidenceOfPerformance: The impact-ratio report with sample sizes.
tests:
  - id: L0-FAI-02-T1
    type: document_review
    oracle: { kind: human_assessor, observes: The impact-ratio report and the samples it used. }
    fixtures:
      positive: [L0-FAI-02/positive/evidence-valid.json]
      negative:
        - L0-FAI-02/negative/evidence-contradictory.json
        - L0-FAI-02/negative/evidence-cross-tenant.json
        - L0-FAI-02/negative/evidence-empty.json
        - L0-FAI-02/negative/evidence-replayed.json
        - L0-FAI-02/negative/evidence-stale.json
        - L0-FAI-02/negative/evidence-violation.json
    passCriteria: >-
      The report covers every group with sample sizes and compares each ratio with the threshold.
    attempts: 1
evidence:
  - id: L0-FAI-02-E1
    producer: amc.fairness.harness
    bindingFields: [deploymentId, controlId]
    freshness: { maxAgeDays: 120 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [model_version, corpus_version]
owner: { role: head_of_qa }
clock: null
levels: [L2]
crosswalk: []
