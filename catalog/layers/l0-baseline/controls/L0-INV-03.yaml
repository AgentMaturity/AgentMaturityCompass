# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-INV-03
version: "0.1.0"
support: experimental
layer: 0
family: inventory-and-classification
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Risk tier record
statement: >-
  Every agent has a signed risk-tier record with its rationale, and an agent without one is compiled
  at the highest tier.
riskRationale: >-
  A missing or unsupported risk tier lets a high-impact agent run under controls meant for a
  low-impact one.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations:
  - key: eu-ai-act-art-6-2
    registerId: eu-ai-act
    instrument: Artificial Intelligence Act, Regulation (EU) 2024/1689
    clause: Art. 6(2) and Annex III
    edition: Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744 (CELEX 32024R1689, 32026R1744)
    jurisdiction: EU
    statusType: binding-now
    superseded: null
    effectiveDate: "2024-08-01"
    complianceDueDate: "2027-12-02"
    dateNote: null
    url: https://publications.europa.eu/resource/celex/32024R1689
    retrieval:
      state: unverified
      reason: >-
        Not fetched in P1-14: the task allows no network access. Register entry eu-ai-act records the source
        as read in its review; fetch and hash this url before expert review (D-08).
    appliesWhen: { fact: jurisdictions, includesAny: [EU] }
    legalReview: null
    note: >-
      Register: Annex III lists the high-risk use areas; Chapter III Sections 1 to 3 apply to Annex III
      systems from 2027-12-02 (keyDate annexIIIHighRisk).
binding:
  kind: manual
  points: []
  mechanism: >-
    The owner signs a risk-tier record per agent; the compiler reads it as a fact and treats a missing
    record as the highest tier.
  parameters: []
  manualDuty:
    duty: >-
      Sign a risk-tier record with its rationale for each agent and renew it when the use case changes.
    ownerRole: senior_manager
    cadence: at onboarding and on every use-case change
    evidenceOfPerformance: The signed risk-tier record.
tests:
  - id: L0-INV-03-T1
    type: configuration_check
    oracle: { kind: signed_config, observes: The signed risk-tier record and the tier the compiled plan used. }
    fixtures:
      positive: [L0-INV-03/positive/evidence-valid.json]
      negative:
        - L0-INV-03/negative/evidence-contradictory.json
        - L0-INV-03/negative/evidence-cross-tenant.json
        - L0-INV-03/negative/evidence-empty.json
        - L0-INV-03/negative/evidence-replayed.json
        - L0-INV-03/negative/evidence-stale.json
        - L0-INV-03/negative/evidence-violation.json
    passCriteria: >-
      The record verifies and names a tier and rationale; without one the compiled plan uses the highest
      tier. Today a missing riskClass leaves dependent controls unresolved instead.
    attempts: 1
evidence:
