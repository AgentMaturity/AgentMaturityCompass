# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-CHG-02
version: "0.1.0"
support: experimental
layer: 0
family: change-control-and-validation
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Regression on a sequestered test set
statement: >-
  Changes pass a regression suite on a sequestered test set before release, and the CI gate receipt is
  the evidence.
riskRationale: >-
  A test set the developers can see and tune against stops measuring regressions.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: manual
  points: []
  mechanism: >-
    The release gate runs the sequestered regression suite and signs a receipt; a failing or missing
    receipt blocks release.
  parameters: []
  manualDuty:
    duty: >-
      Keep the sequestered set access-controlled and run it before each release.
    ownerRole: head_of_qa
    cadence: every release
    evidenceOfPerformance: The signed gate receipt.
tests:
  - id: L0-CHG-02-T1
    type: configuration_check
    oracle: { kind: signed_config, observes: The signed release-gate receipt and the suite it names. }
    fixtures:
      positive: [L0-CHG-02/positive/evidence-valid.json]
      negative:
        - L0-CHG-02/negative/evidence-contradictory.json
        - L0-CHG-02/negative/evidence-cross-tenant.json
        - L0-CHG-02/negative/evidence-empty.json
        - L0-CHG-02/negative/evidence-replayed.json
        - L0-CHG-02/negative/evidence-stale.json
        - L0-CHG-02/negative/evidence-violation.json
    passCriteria: >-
      The receipt verifies, names the sequestered suite and records a pass. Today AMC's own release gate
      has no sequestered set.
    attempts: 1
evidence:
  - id: L0-CHG-02-E1
    producer: amc.regression.sequestered
    bindingFields: [deploymentId, controlId]
    freshness: { maxAgeDays: 90 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [model_version, prompt_version, tool_version, corpus_version]
owner: { role: head_of_qa }
clock: null
levels: [L2]
crosswalk:
  - framework: amc-audit-map-v1
    clause: INCIDENT_RESPONSE_PREPAREDNESS.ASSURANCE_RUNS
    relation: partial
    rationale: >-
      Recurring assurance runs are related; they are not a sequestered regression gate.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
