# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-IDN-03
version: "0.1.0"
support: experimental
layer: 0
family: identity-and-delegation
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Delegation never widens authority
statement: >-
  A subagent receives equal or narrower scopes, limits and expiry than its parent, and a widening
  delegation is refused.
riskRationale: >-
  If a child can hold more authority than its parent, delegation becomes a way around every limit set
  on the parent.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: enforcement_point
  points: [tool_pipeline]
  mechanism: >-
    A delegation request is compared with the parent's signed scopes, limits and expiry; any wider field
    refuses the delegation before the child runs.
  parameters: []
  manualDuty: null
tests:
  - id: L0-IDN-03-T1
    type: runtime_enforced
    oracle: { kind: enforcement_receipt, observes: The delegation decision and the child's authorization record. }
    fixtures:
      positive: [L0-IDN-03/positive/evidence-valid.json]
      negative:
        - L0-IDN-03/negative/evidence-contradictory.json
        - L0-IDN-03/negative/evidence-cross-tenant.json
        - L0-IDN-03/negative/evidence-empty.json
        - L0-IDN-03/negative/evidence-replayed.json
        - L0-IDN-03/negative/evidence-stale.json
        - L0-IDN-03/negative/evidence-violation.json
    passCriteria: >-
      Equal or narrower delegations are admitted; any wider scope, limit or expiry is refused. Today a
      wider scope is intersected down, not refused, and expiry is not clamped (P2-25).
    attempts: 1
evidence:
  - id: L0-IDN-03-E1
    producer: amc.delegation.chain
    bindingFields: [workspaceId, agentId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [tool_version, policy_version, deployment_version]
owner: { role: ciso }
clock: null
levels: [L2]
crosswalk:
  - framework: amc-audit-map-v1
    clause: ACCESS_CONTROL.LEASE_SCOPING
    relation: partial
    rationale: >-
      Least-privilege leases are related; the audit map does not check delegation chains.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
