# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-DAT-04
version: "0.1.0"
support: experimental
layer: 0
family: data-protection
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Residency routing
statement: >-
  Where a residency rule applies, protected exports use only supported routes, an unsupported route is
  blocked, and no residency claim is made.
riskRationale: >-
  A route outside the permitted region breaks a residency duty the moment data crosses it, and a claim
  of residency without a route check misleads.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: enforcement_point
  points: [egress]
  mechanism: >-
    Egress checks each destination against the signed destination registry and its residency rules and
    blocks unregistered destinations and regions a rule does not allow.
  parameters: []
  manualDuty: null
tests:
  - id: L0-DAT-04-T1
    type: runtime_enforced
    oracle: { kind: enforcement_receipt, observes: The egress decision and the RESIDENCY_ROUTE_BLOCKED guard event. }
    fixtures:
      positive: [L0-DAT-04/positive/allowed-region.json, L0-DAT-04/positive/evidence-valid.json]
      negative:
        - L0-DAT-04/negative/disallowed-region.json
        - L0-DAT-04/negative/edited-registry.json
        - L0-DAT-04/negative/evidence-contradictory.json
        - L0-DAT-04/negative/evidence-cross-tenant.json
        - L0-DAT-04/negative/evidence-empty.json
        - L0-DAT-04/negative/evidence-replayed.json
        - L0-DAT-04/negative/evidence-stale.json
        - L0-DAT-04/negative/evidence-violation.json
        - L0-DAT-04/negative/unknown-region.json
        - L0-DAT-04/negative/unregistered-destination.json
    passCriteria: >-
      A registered destination in an allowed region is admitted; an unregistered destination, a disallowed
      region and an unverifiable registry are blocked.
    attempts: 1
evidence:
  - id: L0-DAT-04-E1
    producer: amc.residency.egress
    bindingFields: [workspaceId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [policy_version, deployment_version]
owner: { role: dpo }
clock: null
levels: [L2, L3]
crosswalk: []
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
