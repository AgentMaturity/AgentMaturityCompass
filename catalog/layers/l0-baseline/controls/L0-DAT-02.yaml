# Draft (P1-14): experimental, agent-drafted and not independently reviewed. Expert sign-off waits for D-08;
# citations are unverified until fetched and hashed. A result under this control is evidence of conformity, never proof of compliance.
id: L0-DAT-02
version: "0.1.0"
support: experimental
layer: 0
family: data-protection
stations: [education, environment, health, wealth, technology, mobility, governance]
title: Redaction before models and logs
statement: >-
  Secrets and declared identifiers are redacted before they reach model providers or persistent logs,
  with a receipt for each redaction.
riskRationale: >-
  A secret sent to a provider or written to a log is disclosed to every party that can read either,
  for as long as either is kept.
mandatory: true
applicability:
  predicate: { always: true }
  reasons: [Layer 0 applies to every agent deployment in every station.]
  exclusions: []
citations: []
binding:
  kind: enforcement_point
  points: [tool_pipeline, egress]
  mechanism: >-
    A redaction step runs before each provider request and each persistent log write and emits a receipt
    per redaction.
  parameters: []
  manualDuty: null
tests:
  - id: L0-DAT-02-T1
    type: runtime_enforced
    oracle:
      kind: enforcement_receipt
      observes: The outbound request, the persisted row and the redaction receipts.
    fixtures:
      positive: [L0-DAT-02/positive/evidence-valid.json]
      negative:
        - L0-DAT-02/negative/evidence-contradictory.json
        - L0-DAT-02/negative/evidence-cross-tenant.json
        - L0-DAT-02/negative/evidence-empty.json
        - L0-DAT-02/negative/evidence-replayed.json
        - L0-DAT-02/negative/evidence-stale.json
        - L0-DAT-02/negative/evidence-violation.json
    passCriteria: >-
      No secret or declared identifier reaches the provider or the log, and each redaction has a receipt.
      Today the gateway redacts its ledger copy only and no per-redaction receipt exists.
    attempts: 1
evidence:
  - id: L0-DAT-02-E1
    producer: amc.redaction.receipt
    bindingFields: [workspaceId, agentId, controlId]
    freshness: { maxAgeDays: 30 }
    sampling: { method: all, ratePercent: null, minItems: 1 }
    retention: { mode: regime_max }
    residency: { mode: inherit_deployment }
invalidatedBy: [model_version, policy_version, deployment_version]
owner: { role: dpo }
clock: null
levels: [L2]
crosswalk:
  - framework: amc-audit-map-v1
    clause: DATA_PROTECTION_AND_PRIVACY.REDACTION
    relation: partial
    rationale: >-
      The audit map checks that redaction defaults are active; it does not require a receipt per
      redaction.
  - framework: amc-audit-map-v1
    clause: DATA_PROTECTION_AND_PRIVACY.NO_SECRET_LEAKS
    relation: partial
    rationale: >-
      The audit map checks for recorded secret-leak findings; it does not check provider requests.
review: { status: pending, expert: null, credential: null, reviewedAt: null, nextReview: null }
provenance: { draftedBy: ai, draftedAt: "2026-10-11", approvedBy: null }
