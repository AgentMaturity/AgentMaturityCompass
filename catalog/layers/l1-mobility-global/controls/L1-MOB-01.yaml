    "passCriteria": "Synthetic fixture behavior only. Every local wrapper remains not_evaluated/dependency_unavailable and releases no lot. Future no-excursion, bound-disposition, warm, wrong-lot, missing and stale cases are unexecuted metadata. The signature allow/deny integration criterion is open until the actual P2-27 fixture and adapter are reused. Separate native questionnaire evidence can never create a regulated pass; missing production evidence is not evaluated."
