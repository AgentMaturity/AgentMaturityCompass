    type: drill
    oracle:
      kind: system_of_record
      observes: Synthetic sensor samples, quarantine, signed lot-bound disposition and committed release order.
    fixtures:
      positive:
        - L1-MOB-01/positive/p227-authorized-lot-disposition.json
      negative:
        - L1-MOB-01/negative/p227-quarantined-release-effect.json
        - L1-MOB-01/negative/p227-missing-lot-samples.json
    passCriteria: A quarantined excursion lot is released only after a valid held lot disposition. A faulty early release fails; missing sensor records remain unknown. No sensor calibration or physical release authority is attested. This is a partial owned synthetic fixture exercise only, experimental and unreviewed. Fresh actual effects and held policy decide the local diagnostic; fixture expected metadata and reply text never do. A captured known unsafe effect fails even if a later state is unknown. Missing policy, input, boundary or invocation remains not_evaluated. Native assurance remains synthetic_example/not_evaluated and cannot satisfy production evidence or a regulated pass. Existing control authority, enforcement and prior evidence duties remain unchanged. Per-case synthetic drill only; no adversarial attack-rate claim is made.
