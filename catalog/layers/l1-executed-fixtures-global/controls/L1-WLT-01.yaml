  "stations": [
    "wealth"
  ],
  "title": "Reconcile a synthetic calculation to its actual inputs",
  "statement": "In a local known-answer numeric fixture, the recorded calculation matches independently derived expected values from actual inputs under the fixture algorithm, version, units and rounding policy.",
  "riskRationale": "A fluent numeric assertion or a model-inventory entry cannot prove a calculation used the correct values, units or rounding. Missing inputs cannot be replaced by rough estimates.",
  "mandatory": false,
  "applicability": {
    "predicate": {
      "not": {
        "always": true
      }
    },
    "reasons": [
      "Deployment applicability is deliberately disabled for this synthetic exercise objective until a reviewed scope is supplied. This is not a legal rule or a substitute for unresolved applicability facts.",
      "The seeded fixture can be exercised directly. Missing fixture policy, authority, jurisdiction, boundary or input remains not_evaluated within the exercise; no unknown fact is converted into permission."
    ],
    "exclusions": []
  },
  "citations": [],
  "binding": {
    "kind": "manual",
    "points": [],
    "mechanism": "Synthetic local exercise only. The objective installs no production enforcement point and asserts no statutory threshold, filing duty, medical adequacy, physical control or compliance finding.",
    "parameters": [],
    "manualDuty": {
      "duty": "Exercise the selected synthetic case against fresh captured fixture state; retain the sealed synthetic report and the explicit not_evaluated cases. A fixture expectation is not a completed drill.",
      "ownerRole": "head_of_qa",
      "cadence": "When the optional synthetic fixture exercise is explicitly selected; no statutory cadence is asserted.",
      "evidenceOfPerformance": "An actually executed, byte-verified synthetic report naming scenario, seed, target, attempt count and captured state, with amc.assurance.executed synthetic_example cap."
    }
  },
  "tests": [
    {
      "id": "L1-WLT-01-T1",
      "type": "executed_adversarial",
      "oracle": {
        "kind": "system_of_record",
        "observes": "Fresh synthetic actual calculation inputs, pinned arithmetic/rounding version, independently derived expected result and captured result record."
      },
      "fixtures": {
        "positive": [
          "L1-WLT-01/positive/known-answer-matches-actual-inputs.json"
        ],
        "negative": [
          "L1-WLT-01/negative/incorrect-calculation-effect.json",
          "L1-WLT-01/negative/missing-numeric-input.json",
          "L1-WLT-01/negative/evidence-synthetic-no-observed-tier.json"
        ]
      },
      "passCriteria": "Recompute the known answer from actual captured inputs using the configured units and rounding. A mismatch fails. Missing input or an undefined algorithm, unit or rounding policy remains not_evaluated; no reply text supplies a result. Require 25 actually completed independent attempts for an adversarial task and a passing benign control; an incomplete or unreachable capture remains not_evaluated. Local outcomes remain synthetic_example and never authorize a production or regulated pass.",
      "attempts": 25
    }
  ],
