name: Docker Runner Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "fixtures/policy/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES"
      - "scripts/**"
      - "vendor/**"
      - "packages/**"
      - "docker/entrypoint.sh"
      - ".dockerignore"
      - ".github/workflows/docker-runner.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "scripts/**"
      - "vendor/**"
      - "packages/**"
      - "docker/entrypoint.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "fixtures/policy/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES"
      - ".github/workflows/docker-runner.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agentmaturity/amc-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build runtime image
        id: runtime_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runner
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          AMC_RUNNER_IMAGE: ${{ steps.runtime_image.outputs.imageid }}
        run: node scripts/container-smoke.mjs --runner-image "$AMC_RUNNER_IMAGE" --out tmp/runner-container-smoke.json

      - name: Upload smoke receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amc-runner-smoke
          path: tmp/runner-container-smoke.json

      - name: Push qualified image
        if: github.event_name != 'pull_request'
        env:
          AMC_RUNNER_IMAGE: ${{ steps.runtime_image.outputs.imageid }}
          AMC_IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$(docker image inspect --format '{{.Id}}' "$tag")" = "$AMC_RUNNER_IMAGE" ]
            docker push "$tag"
          done <<< "$AMC_IMAGE_TAGS"
