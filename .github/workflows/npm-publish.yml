name: npm Publish

# Version PRs only (P0-34). This workflow never publishes, tags or creates a release:
# release.yml, run from a v*.*.* tag in the protected `release` environment, is the only publisher.
#
# P1-41 weekly release train (docs/RELEASE_CADENCE.md):
#   1. Changesets land on main via PRs (ci.yml enforces their presence)
#   2. On every push to main, every Tuesday 09:00 UTC (the day before the Wednesday release day; Sid confirms the
#      day and time, docs/PUBLISHING.md) and on manual dispatch, when CHANGESETS_GITHUB_TOKEN is configured, this
#      workflow opens or refreshes the "Version Packages" PR with exactly the output of
#      `node scripts/release-prepare.mjs --version-only`: release notes, the version bump from the published version,
#      one CHANGELOG heading and the version-coupled files. With no pending changesets there is no PR: that week is
#      skipped. The PR's commits are pushed with that token, so CI runs on them.
#   3. Sid merges it, then tags the merge commit; the tag runs release.yml (docs/RELEASE_RUNBOOK.md)

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: full test + build must pass before any release action
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6 # TODO(P1-41 follow-up): pin actions/checkout@v6 by full commit SHA
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # TODO(P1-41 follow-up): pin pnpm/action-setup@v4 by full commit SHA
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6 # TODO(P1-41 follow-up): pin actions/setup-node@v6 by full commit SHA
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Test
        timeout-minutes: 30
        shell: bash
        # The full output goes to the log artifact; the runner log gets lines cut at
        # 4,096 bytes. A test once teed a 5 MiB single-line answer to stdout, and a
        # line that long stalls the Actions runner until the job times out with no
        # log at all (every build-test run from 2026-09-16 to 2026-10-05).
        run: |
          mkdir -p tmp/ci-tests
          npm test -- --reporter=default --reporter=json --reporter=hanging-process --outputFile.json=tmp/ci-tests/tests.json 2>&1 | tee tmp/ci-tests/tests.log | cut -c1-4096

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7 # TODO(P1-41 follow-up): pin actions/upload-artifact@v7 by full commit SHA
        with:
          name: npm-publish-test-diagnostics
          path: tmp/ci-tests/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Prepack release guardrails
        run: npm run release:prepack-check

  # Writes only through CHANGESETS_GITHUB_TOKEN, which reaches only the changesets step. The checkout keeps no
  # credentials, so changesets/action pushes with that token (not the workflow token) and CI runs on the PR.
  version-pr:
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6 # TODO(P1-41 follow-up): pin actions/checkout@v6 by full commit SHA
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # TODO(P1-41 follow-up): pin pnpm/action-setup@v4 by full commit SHA
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6 # TODO(P1-41 follow-up): pin actions/setup-node@v6 by full commit SHA
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Version PR preflight
        id: release_preflight
        env:
          CHANGESETS_GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}
        run: |
          if [ -z "$CHANGESETS_GITHUB_TOKEN" ]; then
            echo "::notice::No version PR: CHANGESETS_GITHUB_TOKEN is not configured. Nothing is published from this workflow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Create or update the version PR
        if: steps.release_preflight.outputs.enabled == 'true'
        uses: changesets/action@v1 # TODO(P1-41 follow-up): pin changesets/action@v1 by full commit SHA
        with:
          version: node scripts/release-prepare.mjs --version-only
          title: "chore: version packages for release"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}
