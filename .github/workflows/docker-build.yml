name: Docker Build

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint/template
        run: |
          helm lint ./deploy/helm/amc
          helm template amc ./deploy/helm/amc > /tmp/amc-helm-rendered.yaml

      - name: Build Docker image
        run: docker build --target studio -t amc-studio:ci .

      - name: Qualify installed Studio runtime
        run: node scripts/container-smoke.mjs --studio-image amc-studio:ci --out tmp/container-smoke.json

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amc-docker-smoke
          path: tmp/container-smoke.json
