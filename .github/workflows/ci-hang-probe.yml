# Temporary diagnostic for plan item P0-48 (GitHub build-test hang). Never merge.
# Round 1: every variant (coverage or not, default or 2 workers) killed the runner.
# Round 2: inside a 12 GB container the runner still died ~10 min into the suite
# with 87 GB disk free. Round 3: bisect by shard; a shard whose runner dies
# (cancelled, no log) holds the culprit.
# Round 4: shard 8 of 8 hung (others finished in ~5 min); split its 190 files
# into 8 explicit lists under .github/probe/.
# Round 5: part 4 hung (24 files); run each file on its own runner.
name: CI hang probe (P0-48)

on:
  pull_request:
    paths:
      - ".github/workflows/ci-hang-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        file: ["tests/compliance/dataResidencyPersistence.test.ts", "tests/falsePositiveTracker.test.ts", "tests/approvalPolicyFailClosed.test.ts", "tests/gap0812PerceptUiReplayCorpusBoundary.test.ts", "tests/cliDelegateFlag.test.ts", "tests/foreignSubagentRunner.test.ts", "tests/artifactProvenance.test.ts", "tests/connectHookIntegration.test.ts", "tests/deepseekNativeWire.test.ts", "tests/execProcessTree.test.ts", "tests/gap0708AzobenzeneReplayCorpusUnavailableBoundary.test.ts", "tests/gap1044GraphRagBenchmarkLiveDriftBoundary.test.ts", "tests/publicDistributionTruth.test.ts", "tests/mislabeledSynthesis.test.ts", "tests/jsonlWriterResume.test.ts", "tests/gap0663DbmsConfigurationQuestionExplainabilityBoundary.test.ts", "tests/studioNativeTaskValidation.test.ts", "tests/gap0925BiliCorePublicMethodologyBoundary.test.ts", "tests/sessionSpillRead.test.ts", "tests/gap1236PromptfooAdversarialRegressionBoundary.test.ts", "tests/gap1081TruthTheoryProviderRiskBoundary.test.ts", "tests/humanFirstUseCapture.test.ts", "tests/networkTrust.test.ts", "tests/platformQualificationOutputOwnership.test.ts"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - name: Single file
        timeout-minutes: 15
        env:
          FILE: ${{ matrix.file }}
        run: npx vitest run "$FILE" --reporter=verbose
