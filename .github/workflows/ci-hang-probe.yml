# Temporary diagnostic for plan item P0-48 (GitHub build-test hang). Never merge.
# Round 1: every variant (coverage or not, default or 2 workers) killed the runner.
# Round 2: inside a 12 GB container the runner still died ~10 min into the suite
# with 87 GB disk free. Round 3: bisect by shard; a shard whose runner dies
# (cancelled, no log) holds the culprit.
# Round 4: shard 8 of 8 hung (others finished in ~5 min); split its 190 files
# into 8 explicit lists under .github/probe/.
# Round 5: part 4 hung (24 files); run each file on its own runner.
# Round 6: only tests/foreignSubagentRunner.test.ts hung. Confirm the cause (a
# 5 MiB single-line tee to stdout): A = original test with stdout redirected,
# B = patched test printing normally.
name: CI hang probe (P0-48)

on:
  pull_request:
    paths:
      - ".github/workflows/ci-hang-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [original-redirected, patched-printing]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - name: Run ${{ matrix.variant }}
        timeout-minutes: 15
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "original-redirected" ]; then
            git show origin/main:tests/foreignSubagentRunner.test.ts > tests/foreignSubagentRunner.test.ts
            npx vitest run tests/foreignSubagentRunner.test.ts > /tmp/out.txt 2>&1; rc=$?
            echo "exit=$rc bytes=$(wc -c < /tmp/out.txt) longest=$(awk '{ if (length($0) > m) m = length($0) } END { print m }' /tmp/out.txt)"
            grep -E 'Tests  ' /tmp/out.txt
            exit $rc
          else
            npx vitest run tests/foreignSubagentRunner.test.ts --reporter=verbose
          fi
