name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            if (labels.includes("skip-changeset")) {
              core.info("skip-changeset label present; skipping changeset requirement.");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const hasChangeset = files.some((f) => f.filename.startsWith(".changeset/") && f.filename.endsWith(".md") && !f.filename.endsWith("README.md"));
            if (!hasChangeset) {
              core.setFailed("Missing changeset file. Add one with `npm run changeset` or apply `skip-changeset` label.");
            }

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      # P0-16: random or hash-derived results, fabricated-result identifiers,
      # path-presence scoring and certification wording (docs/CI.md).
      - name: No fabricated results
        run: npm run check:no-fabrication

      # P0-11: every enforcement point, test and owner the channel map cites
      # exists (docs/security/THREAT_MODEL.md).
      - name: Threat model channel map
        run: npm run check:threat-model

      - name: Acceptance runner process cleanup
        timeout-minutes: 1
        run: node --test scripts/lib/ownedProcessCommand.test.mjs

      - name: Build
        run: npm run build

      - name: Regulatory register currency
        run: npm run check:regulatory-currency

      - name: Citation lint (P0-25)
        run: npm run check:citations

      - name: Published package lint
        run: npm run check:package

      # Report-only until decision D-11 sets the source-quality policy
      # (1,253 duplicate blocks and 2,339 Knip findings on 2026-10-05);
      # plan item P1-52 then turns this into a blocking ratchet.
      - name: Source duplication and reachability
        continue-on-error: true
        run: |
          npm run check:duplicates
          npm run check:dead-code

      - name: Policy fixture regression
        if: matrix.node-version == '24'
        run: npm run check:policy-fixtures

      - name: Upload policy fixture report
        if: ${{ always() && matrix.node-version == '24' }}
        uses: actions/upload-artifact@v7
        with:
          name: policy-fixture-report
          path: tmp/policy-fixtures/ci-report.json
          if-no-files-found: ignore

      - name: Architecture boundary compatibility
        run: npm run check:architecture-boundaries

      # Fails when a published count (adapters, packs, questions, tests) drifts
      # from what the repository actually contains.
      - name: Published counts match reality
        run: npm run check:counts

      # Phase 0 freeze: no new CLI command paths or station-pack questions
      # without a named freeze exception (docs/program/READY_TO_DEPLOY.md).
      - name: Freeze guard (until Gate G0)
        run: npm run check:freeze

      - name: Qualification receipts
        run: npm run check:qualification

      # The question-bank export is generated; fail if it has drifted from the
      # live bank.
      - name: Generated docs are current
        run: npm run check:question-bank-export

      # Both gates existed as npm scripts that no workflow ran, so docs drift
      # and incident-readiness regressions could merge and ship unchecked.
      # Coverage thresholds were pinned at 0, so the gate could never fail and
      # whole subsystems could lose their tests silently. Now enforced.
      # One instrumented suite supplies test outcomes and global/per-file coverage.
      - name: Full suite and coverage thresholds
        timeout-minutes: 45
        shell: bash
        # The full output goes to the log artifact; the runner log gets lines cut at
        # 4,096 bytes. A test once teed a 5 MiB single-line answer to stdout, and a
        # line that long stalls the Actions runner until the job times out with no
        # log at all (every build-test run from 2026-09-16 to 2026-10-05).
        run: |
          mkdir -p tmp/ci-coverage
          npm run test:coverage -- --exclude 'tests/performance/**' --reporter=default --reporter=json --reporter=hanging-process --outputFile.json=tmp/ci-coverage/tests.json 2>&1 | tee tmp/ci-coverage/tests.log | cut -c1-4096

      # Throughput floors hold for uninstrumented code with the CPU to itself. Under
      # coverage, with every worker busy, the 500 ev/s control-plane floor measured
      # 477-496 ev/s on hosted runners, so the performance files run here instead.
      - name: Performance floors (no coverage, one file at a time)
        run: npx vitest run tests/performance --no-file-parallelism

      # Tests must use temp workspaces; a write to a tracked or untracked path
      # (for example .amc/keys/*) fails here. Ignored dist/, tmp/ and coverage/ do not show.
      - name: Tests left the checkout clean
        run: git status --porcelain=v1 --untracked-files=all > /tmp/after-tests.txt; if [ -s /tmp/after-tests.txt ]; then cat /tmp/after-tests.txt; exit 1; fi

      - name: Per-file coverage floors
        run: npm run check:coverage

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-diagnostics-node-${{ matrix.node-version }}
          path: |
            tmp/ci-coverage/
            coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Docs drift
        run: npm run check:docs-drift

      - name: Incident readiness
        run: npm run check:incident-readiness

      - name: Compliance artifact freshness
        run: npm run check:compliance-freshness

      - name: Evidence path check
        run: npm run check:evidence-paths

      - name: API reference drift
        run: npm run check:api-ref

      - name: Changelog page drift
        run: npm run check:changelog-page

      - name: Vendored kernel integrity
        run: |
          npm run check:vendor-links
          npm run check:vendor-rescope
          npm run check:third-party-notices

      - name: Release smoke checks
        run: |
          npm pack --ignore-scripts --json > /tmp/amc-pack.json
          TGZ=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/amc-pack.json","utf8"));process.stdout.write(j[0].filename)')
          node dist/cli.js release sbom --out /tmp/sbom.cdx.json
          node dist/cli.js release licenses --out /tmp/licenses.json
          node dist/cli.js release provenance --out /tmp/provenance.json
          node dist/cli.js release scan --in "$TGZ" --out /tmp/secret-scan.json

      - name: Tests left the checkout clean (end of job)
        if: always()
        run: git status --porcelain=v1 --untracked-files=all > /tmp/after-tests.txt; if [ -s /tmp/after-tests.txt ]; then cat /tmp/after-tests.txt; exit 1; fi

  e2e-smoke-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Local e2e smoke
        run: node dist/cli.js e2e smoke --mode local --json > /tmp/e2e-smoke-local.json

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-local
          path: /tmp/e2e-smoke-local.json

  clean-source:
    # AMC-1509: the documented source path, executed on a fresh clone. Catches
    # lockfile drift and stale install instructions that string checks cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # The check installs inside an isolated HOME and deletes its store.
          # No outer pnpm store exists for setup-node's cache post-step to save.
          package-manager-cache: false
      - name: Clean-source check
        run: node scripts/clean-source-check.mjs

  packed-install:
    # AMC-1510: the published artifact must deliver the governed native runtime.
    # Packs as publish would, installs outside the checkout with an empty HOME,
    # proves @amc/core is absent there, and runs a keyless signed turn anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Packed-install check
        run: node scripts/packed-install-check.mjs

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build source image targets
        run: |
          docker build --target studio -t amc-studio:ci .
          docker build --target runner -t amc-runner:ci .
      - name: Qualify installed container runtime
        run: node scripts/container-smoke.mjs --studio-image amc-studio:ci --runner-image amc-runner:ci --out tmp/container-smoke.json
      - name: Upload docker smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke
          path: tmp/container-smoke.json

  helm-lint-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint/template
        run: |
          helm lint ./deploy/helm/amc
          helm template amc ./deploy/helm/amc > /tmp/amc-helm-rendered.yaml
          grep -q "kind: Deployment" /tmp/amc-helm-rendered.yaml
          grep -q "kind: Service" /tmp/amc-helm-rendered.yaml
          grep -q "kind: PersistentVolumeClaim" /tmp/amc-helm-rendered.yaml
          grep -q "kind: NetworkPolicy" /tmp/amc-helm-rendered.yaml
          grep -q "kind: PodDisruptionBudget" /tmp/amc-helm-rendered.yaml
          grep -q "runAsNonRoot: true" /tmp/amc-helm-rendered.yaml
          grep -q "readOnlyRootFilesystem: true" /tmp/amc-helm-rendered.yaml
          grep -q "allowPrivilegeEscalation: false" /tmp/amc-helm-rendered.yaml

          # Ingress is optional by default; verify it via the shipped example overlay.
          helm template amc ./deploy/helm/amc -f ./deploy/helm/amc/examples/values-ingress-tls.yaml > /tmp/amc-helm-ingress-rendered.yaml
          grep -q "kind: Ingress" /tmp/amc-helm-ingress-rendered.yaml

      - name: Upload helm render artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helm-template
          path: /tmp/amc-helm-rendered.yaml

  security-scan-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Scan repository and plugin fixture
        run: node scripts/security-scan-lite.mjs /tmp/security-scan-lite.json

      - name: Create signed release bundle for scan
        run: |
          node -e "const fs=require('fs');const {generateKeyPairSync}=require('crypto');const kp=generateKeyPairSync('ed25519');fs.writeFileSync('/tmp/amc-release.key',kp.privateKey.export({format:'pem',type:'pkcs8'}),{mode:0o600});"
          node dist/cli.js release pack --out /tmp/amc-ci.amcrelease --private-key /tmp/amc-release.key --skip-install-build

      - name: Scan release bundle and produce license inventory
        run: |
          node dist/cli.js release scan --in /tmp/amc-ci.amcrelease --out /tmp/release-secret-scan.json
          node dist/cli.js release licenses --out /tmp/licenses.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-lite
          path: |
            /tmp/security-scan-lite.json
            /tmp/release-secret-scan.json
            /tmp/licenses.json
