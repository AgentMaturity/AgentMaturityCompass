name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            if (labels.includes("skip-changeset")) {
              core.info("skip-changeset label present; skipping changeset requirement.");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const hasChangeset = files.some((f) => f.filename.startsWith(".changeset/") && f.filename.endsWith(".md") && !f.filename.endsWith("README.md"));
            if (!hasChangeset) {
              core.setFailed("Missing changeset file. Add one with `npm run changeset` or apply `skip-changeset` label.");
            }

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      # P0-16: random or hash-derived results, fabricated-result identifiers,
      # path-presence scoring and certification wording (docs/CI.md).
      - name: No fabricated results
        run: npm run check:no-fabrication

      # P1-41: published release notes never use a banned claim word, even negated (docs/RELEASE_RUNBOOK.md).
      - name: Release notes claim words
        run: node scripts/check-release-notes.mjs docs/releases/*.md

      # P0-11: every enforcement point, test and owner the channel map cites
      # exists (docs/security/THREAT_MODEL.md).
      - name: Threat model channel map
        run: npm run check:threat-model

      - name: Acceptance runner process cleanup
        timeout-minutes: 1
        run: node --test scripts/lib/ownedProcessCommand.test.mjs

      - name: Build
        run: npm run build

      - name: Published schemas match the enforced schemas (P1-01)
        run: npm run check:schemas

      - name: Regulatory register currency
        run: npm run check:regulatory-currency

      # P1-34: catalog reviews falling due, GOV_REVERIFY_OPEN, and one appended
      # catalog/CHANGELOG.md entry per catalog digest change (docs/catalog/GOVERNANCE.md).
      - name: Catalog currency and changelog
        run: |
          npm run check:catalog-currency
          npm run check:catalog-changelog

      - name: Citation lint (P0-25)
        run: npm run check:citations

      - name: Published package lint
        run: npm run check:package

      # D-11 option A: both checks are a ratchet against
      # scripts/quality/source-quality-baseline.json (P1-52) and fail only on
      # new or stale findings, on config/tool drift, or on a baseline entry
      # missing from the target branch's baseline at the merge-base (only
      # --accept may add one). P0-33 requires both checks to pass.
      - name: Source duplication and reachability
        env:
          QUALITY_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          npm run check:duplicates -- --base "$QUALITY_BASE"
          npm run check:dead-code -- --base "$QUALITY_BASE"

      - name: Upload source-quality summary
        if: ${{ always() && matrix.node-version == '24' }}
        uses: actions/upload-artifact@v7
        with:
          name: source-quality-summary
          path: tmp/source-quality/
          if-no-files-found: ignore

      - name: Policy fixture regression
        if: matrix.node-version == '24'
        run: npm run check:policy-fixtures

      - name: Upload policy fixture report
        if: ${{ always() && matrix.node-version == '24' }}
        uses: actions/upload-artifact@v7
        with:
          name: policy-fixture-report
          path: tmp/policy-fixtures/ci-report.json
          if-no-files-found: ignore

      - name: Architecture boundary compatibility
        run: npm run check:architecture-boundaries

      # Fails when a published count (adapters, packs, questions, tests) drifts
      # from what the repository actually contains.
      - name: Published counts match reality
        run: npm run check:counts

      # Phase 0 freeze: no new CLI command paths or station-pack questions
      # without a named freeze exception (docs/program/READY_TO_DEPLOY.md).
      - name: Freeze guard (until Gate G0)
        run: npm run check:freeze

      - name: Qualification receipts
        run: npm run check:qualification

      # The question-bank export is generated; fail if it has drifted from the
      # live bank.
      - name: Generated docs are current
        run: npm run check:question-bank-export

      # P1-07: every evaluated diagnostic gate requirement has a registered,
      # non-synthetic emitter; prints the per-level reachability table.
      - name: Diagnostic gate reachability
        run: npm run check:gates

      - name: Set up Helm for full test suite
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "v4.3.0"

      # Both gates existed as npm scripts that no workflow ran, so docs drift
      # and incident-readiness regressions could merge and ship unchecked.
      # Coverage thresholds were pinned at 0, so the gate could never fail and
      # whole subsystems could lose their tests silently. Now enforced.
      # One instrumented suite supplies test outcomes and global/per-file coverage.
      - name: Full suite and coverage thresholds
        timeout-minutes: 45
        shell: bash
        # The full output goes to the log artifact; the runner log gets lines cut at
        # 4,096 bytes. A test once teed a 5 MiB single-line answer to stdout, and a
        # line that long stalls the Actions runner until the job times out with no
        # log at all (every build-test run from 2026-09-16 to 2026-10-05).
        run: |
          mkdir -p tmp/ci-coverage
          npm run test:coverage -- --exclude 'tests/performance/**' --reporter=default --reporter=json --reporter=hanging-process --outputFile.json=tmp/ci-coverage/tests.json 2>&1 | tee tmp/ci-coverage/tests.log | cut -c1-4096

      # Throughput floors hold for uninstrumented code with the CPU to itself. Under
      # coverage, with every worker busy, the 500 ev/s control-plane floor measured
      # 477-496 ev/s on hosted runners, so the performance files run here instead.
      - name: Performance floors (no coverage, one file at a time)
        run: npx vitest run tests/performance --no-file-parallelism

      # Tests must use temp workspaces; a write to a tracked or untracked path
      # (for example .amc/keys/*) fails here. Ignored dist/, tmp/ and coverage/ do not show.
      - name: Tests left the checkout clean
        run: git status --porcelain=v1 --untracked-files=all > /tmp/after-tests.txt; if [ -s /tmp/after-tests.txt ]; then cat /tmp/after-tests.txt; exit 1; fi

      - name: Per-file coverage floors
        run: npm run check:coverage

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-diagnostics-node-${{ matrix.node-version }}
          path: |
            tmp/ci-coverage/
            coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Docs drift
        run: npm run check:docs-drift

      - name: Incident readiness
        run: npm run check:incident-readiness

      - name: Compliance artifact freshness
        run: npm run check:compliance-freshness

      - name: Evidence path check
        run: npm run check:evidence-paths

      - name: API reference drift
        run: npm run check:api-ref

      # P1-40: the public API snapshot of agent-maturity-compass/sdk/native (docs/sdk/TYPESCRIPT_SDK.md).
      - name: SDK API snapshot
        run: npm run check:sdk-api

      - name: Changelog page drift
        run: npm run check:changelog-page

      # P1-38: docs/providers/CAPABILITY_MATRIX.md is the rendering of its test evidence.
      - name: Capability matrix drift
        run: npm run check:capability-matrix

      - name: Vendored kernel integrity
        run: |
          npm run check:vendor-links
          npm run check:vendor-rescope
          npm run check:third-party-notices

      - name: Release smoke checks
        run: |
          npm pack --ignore-scripts --json > /tmp/amc-pack.json
          TGZ=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/amc-pack.json","utf8"));process.stdout.write(j[0].filename)')
          node dist/cli.js release sbom --out /tmp/sbom.cdx.json
          node dist/cli.js release licenses --out /tmp/licenses.json
          node dist/cli.js release provenance --out /tmp/provenance.json
          node dist/cli.js release scan --in "$TGZ" --out /tmp/secret-scan.json

      - name: Tests left the checkout clean (end of job)
        if: always()
        run: git status --porcelain=v1 --untracked-files=all > /tmp/after-tests.txt; if [ -s /tmp/after-tests.txt ]; then cat /tmp/after-tests.txt; exit 1; fi

  release-gate:
    if: github.event_name != 'pull_request'
    # The full native-test corpus exercises Darwin confinement; Ubuntu matrix jobs remain separate.
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Full release gate
        env:
          AMC_RELEASE_GATE_LIVE_URL: ${{ vars.AMC_RELEASE_GATE_LIVE_URL }}
        run: npm run release:gate -- --json --out tmp/release-gate/ci.json
      - name: Upload release gate receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-receipts
          path: |
            tmp/release-gate/
            coverage/coverage-summary.json
          if-no-files-found: ignore

  e2e-playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Playwright suite
        run: npm run test:e2e -- --reporter=line,html
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  e2e-smoke-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Local e2e smoke
        run: node dist/cli.js e2e smoke --mode local --json > /tmp/e2e-smoke-local.json

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-local
          path: /tmp/e2e-smoke-local.json

  clean-source:
    # AMC-1509: the documented source path, executed on a fresh clone. Catches
    # lockfile drift and stale install instructions that string checks cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # The check installs inside an isolated HOME and deletes its store.
          # No outer pnpm store exists for setup-node's cache post-step to save.
          package-manager-cache: false
      - name: Clean-source check
        run: node scripts/clean-source-check.mjs

  packed-install:
    # AMC-1510: the published artifact must deliver the governed native runtime.
    # Packs as publish would, installs outside the checkout with an empty HOME,
    # proves @amc/core is absent there, and runs a keyless signed turn anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Packed-install check
        run: node scripts/packed-install-check.mjs

  # P1-06: the standalone verifier is packed once, then installed with no other
  # dependency and run against the normative fixtures on every supported Node.
  verifier-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run build:verifier
      - run: mkdir -p tmp/verifier-pack && cd packages/verifier && npm pack --pack-destination ../../tmp/verifier-pack
      - uses: actions/upload-artifact@v7
        with:
          name: verifier-pack
          path: tmp/verifier-pack/*.tgz

  verifier-conformance:
    needs: verifier-pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: verifier-pack
          path: tmp/verifier-pack
      - name: Install the packed verifier offline into an empty directory
        run: |
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          echo '{"name":"consumer","private":true}' > package.json
          npm install --offline --no-audit --no-fund --ignore-scripts "$GITHUB_WORKSPACE"/tmp/verifier-pack/*.tgz
      - name: Run the normative fixtures
        run: node packages/verifier/conformance/run.mjs --cmd "$RUNNER_TEMP/consumer/node_modules/.bin/amc-verify" --out "conformance-results-node${{ matrix.node-version }}.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-conformance-node${{ matrix.node-version }}
          path: conformance-results-node${{ matrix.node-version }}.json

  # P0-35: every image is built and qualified natively on each published
  # architecture (GitHub-hosted arm64 Linux runner for public repositories).
  docker-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Base images are pinned by digest
        run: node scripts/check-image-pins.mjs
      - name: Build source image targets
        run: |
          docker build --target studio -t amc-studio:ci .
          docker build --target runner -t amc-runner:ci .
      - name: Qualify installed container runtime
        run: node scripts/container-smoke.mjs --studio-image amc-studio:ci --runner-image amc-runner:ci --out tmp/container-smoke.json
      - name: Build the quickstart and check its version, user and native SQLite
        run: |
          docker build -f docker/Dockerfile.quickstart -t amc-quickstart:ci .
          expected=$(sed -n 's/^ARG AMC_VERSION=//p' docker/Dockerfile.quickstart)
          actual=$(docker run --rm amc-quickstart:ci --version)
          echo "quickstart --version: $actual (pinned $expected)"
          [ "$actual" = "$expected" ]
          [ "$(docker run --rm --entrypoint id amc-quickstart:ci -u)" = "10001" ]
          docker run --rm --entrypoint node amc-quickstart:ci -e 'const r = require("node:module").createRequire("/usr/local/lib/node_modules/agent-maturity-compass/package.json"); new (r("better-sqlite3"))(":memory:").close()'
      - name: Quickstart refuses a wrong tarball hash
        run: |
          mkdir -p tmp
          if docker build -f docker/Dockerfile.quickstart --build-arg AMC_TGZ_SHA256="$(printf '0%.0s' $(seq 64))" . > tmp/quickstart-wrong-hash.log 2>&1; then
            echo "quickstart built with a wrong tarball hash"; exit 1
          fi
          grep -q '/tmp/amc.tgz: FAILED' tmp/quickstart-wrong-hash.log
      - name: Record image IDs for this architecture
        env:
          AMC_ARCH: ${{ matrix.arch }}
          AMC_RUNNER: ${{ matrix.runner }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const docker = (...args) => execFileSync("docker", args, { encoding: "utf8" }).trim();
            const images = {};
            for (const ref of ["amc-studio:ci", "amc-runner:ci", "amc-quickstart:ci"]) {
              const [image] = JSON.parse(docker("image", "inspect", ref));
              if (image.Architecture !== process.env.AMC_ARCH) throw Error(`${ref} is ${image.Architecture}, expected ${process.env.AMC_ARCH}`);
              images[ref] = { id: image.Id, os: image.Os, architecture: image.Architecture };
            }
            const receipt = { arch: process.env.AMC_ARCH, runner: process.env.AMC_RUNNER, docker: docker("version", "--format", "{{.Server.Version}}"),
              buildx: docker("buildx", "version"), images };
            require("node:fs").writeFileSync("tmp/image-ids.json", JSON.stringify(receipt, null, 2) + "\n");
            console.log(JSON.stringify(receipt, null, 2));
          '
      - name: Upload docker smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-${{ matrix.arch }}
          path: |
            tmp/container-smoke.json
            tmp/image-ids.json
            tmp/quickstart-wrong-hash.log

  helm-lint-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint/template
        run: |
          helm lint ./deploy/helm/amc
          helm template amc ./deploy/helm/amc > /tmp/amc-helm-rendered.yaml
          grep -q "kind: Deployment" /tmp/amc-helm-rendered.yaml
          grep -q "kind: Service" /tmp/amc-helm-rendered.yaml
          grep -q "kind: PersistentVolumeClaim" /tmp/amc-helm-rendered.yaml
          grep -q "kind: NetworkPolicy" /tmp/amc-helm-rendered.yaml
          grep -q "kind: PodDisruptionBudget" /tmp/amc-helm-rendered.yaml
          grep -q "runAsNonRoot: true" /tmp/amc-helm-rendered.yaml
          grep -q "readOnlyRootFilesystem: true" /tmp/amc-helm-rendered.yaml
          grep -q "allowPrivilegeEscalation: false" /tmp/amc-helm-rendered.yaml

          # Ingress is optional by default; verify it via the shipped example overlay.
          helm template amc ./deploy/helm/amc -f ./deploy/helm/amc/examples/values-ingress-tls.yaml > /tmp/amc-helm-ingress-rendered.yaml
          grep -q "kind: Ingress" /tmp/amc-helm-ingress-rendered.yaml

      - name: Upload helm render artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helm-template
          path: /tmp/amc-helm-rendered.yaml

  security-scan-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Scan repository and plugin fixture
        run: node scripts/security-scan-lite.mjs /tmp/security-scan-lite.json

      - name: Create signed release bundle for scan
        run: |
          node -e "const fs=require('fs');const {generateKeyPairSync}=require('crypto');const kp=generateKeyPairSync('ed25519');fs.writeFileSync('/tmp/amc-release.key',kp.privateKey.export({format:'pem',type:'pkcs8'}),{mode:0o600});"
          node dist/cli.js release pack --out /tmp/amc-ci.amcrelease --private-key /tmp/amc-release.key --skip-install-build

      - name: Scan release bundle and produce license inventory
        run: |
          node dist/cli.js release scan --in /tmp/amc-ci.amcrelease --out /tmp/release-secret-scan.json
          node dist/cli.js release licenses --out /tmp/licenses.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-lite
          path: |
            /tmp/security-scan-lite.json
            /tmp/release-secret-scan.json
            /tmp/licenses.json
