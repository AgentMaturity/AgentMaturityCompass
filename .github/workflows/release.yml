name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to release"
        required: true
        type: string

env:
  AMC_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  desktop-assets:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AMC_RELEASE_TAG }}

      - name: Validate release tag input
        run: |
          printf '%s\n' "$AMC_RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Release tag must match vX.Y.Z; got $AMC_RELEASE_TAG"
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop release archives
        run: env -u GITHUB_REF_NAME AMC_RELEASE_TAG="$AMC_RELEASE_TAG" npm run package:desktop

      - name: Verify desktop release archives
        run: npm run package:desktop:verify

      - name: Prepare checksummed public release assets
        run: npm run release:prepare-assets

      - name: Upload public release assets
        uses: actions/upload-artifact@v7
        with:
          name: amc-public-release-assets
          path: |
            dist/release-assets/SHA256SUMS
            dist/release-assets/amc-release-manifest.json
            dist/release-assets/*.tgz
            dist/release-assets/*.tar.gz
            dist/release-assets/*.zip
          if-no-files-found: error

  # P0-35: build, qualify and push the Studio image natively per architecture.
  # Only the per-architecture tags are pushed here; the release job creates the
  # public multi-platform tags from these digests after its tests pass.
  image:
    needs: desktop-assets
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AMC_RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase GHCR image repository
        id: image
        run: |
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "repository=ghcr.io/${OWNER}/amc-studio" >> "$GITHUB_OUTPUT"

      - name: Build Docker image for qualification
        id: runtime_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: studio
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.image.outputs.repository }}:${{ env.AMC_RELEASE_TAG }}-${{ matrix.arch }}

      - name: Qualify exact loaded Studio image
        env:
          AMC_STUDIO_IMAGE: ${{ steps.runtime_image.outputs.imageid }}
        run: node scripts/container-smoke.mjs --studio-image "$AMC_STUDIO_IMAGE" --out tmp/container-smoke.json

      - name: Upload container qualification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-container-smoke-${{ matrix.arch }}
          path: tmp/container-smoke.json

      - name: Push qualified per-architecture image to GHCR
        env:
          AMC_STUDIO_IMAGE: ${{ steps.runtime_image.outputs.imageid }}
          AMC_REPOSITORY: ${{ steps.image.outputs.repository }}
          AMC_ARCH: ${{ matrix.arch }}
        run: |
          tag="$AMC_REPOSITORY:$AMC_RELEASE_TAG-$AMC_ARCH"
          [ "$(docker image inspect --format '{{.Id}}' "$tag")" = "$AMC_STUDIO_IMAGE" ]
          docker push "$tag"
          mkdir -p tmp/image-digest
          docker image inspect "$tag" | node -e '
            const image = JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0];
            const digest = image.RepoDigests.find(value => value.startsWith(process.argv[1] + "@"))?.split("@")[1];
            if (!/^sha256:[a-f0-9]{64}$/.test(digest ?? "")) throw Error("pushed image digest missing");
            if (image.Id !== process.env.AMC_STUDIO_IMAGE || image.Architecture !== process.env.AMC_ARCH) throw Error("pushed image is not the qualified image");
            const receipt = require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync("tmp/container-smoke.json")).digest("hex");
            console.log(JSON.stringify({ arch: process.env.AMC_ARCH, platform: "linux/" + process.env.AMC_ARCH, imageId: image.Id, digest, containerSmokeSha256: receipt }));
          ' "$AMC_REPOSITORY" > "tmp/image-digest/$AMC_ARCH.json"
          cat "tmp/image-digest/$AMC_ARCH.json"

      - name: Upload per-architecture digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: tmp/image-digest/${{ matrix.arch }}.json
          if-no-files-found: error

  release:
    needs: [desktop-assets, image]
    runs-on: ubuntu-latest
    # P0-34: the only job that publishes. Its secrets live in the protected `release` environment (P0-38).
    environment: release
    # Covers npm test, the build and the full release gate that npm publish re-runs in prepack (measured in qualification/2026-10-11-P0-34).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.AMC_RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version, one CHANGELOG heading, release notes, no pending changesets.
      - name: Check the release candidate
        run: node scripts/check-release-candidate.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify release version contract
        run: env -u GITHUB_REF_NAME AMC_RELEASE_TAG="$AMC_RELEASE_TAG" npm run release:verify-version

      - name: Prepack release guardrails
        run: npm run release:prepack-check

      - name: Check package contents and secret-scan the packed tarball
        run: node scripts/check-pack-contents.mjs

      - name: Validate tag version matches package.json
        run: |
          TAG="${AMC_RELEASE_TAG#v}"
          PKG_VERSION=$(node -e 'const pkg=require("./package.json");process.stdout.write(pkg.version)')
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Download checksummed public release assets
        uses: actions/download-artifact@v8
        with:
          name: amc-public-release-assets
          path: dist/release-assets

      - name: Verify downloaded public release assets
        run: |
          cd dist/release-assets
          sha256sum -c SHA256SUMS

      - name: Resolve lowercase GHCR image repository
        id: image
        run: |
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "repository=ghcr.io/${OWNER}/amc-studio" >> "$GITHUB_OUTPUT"

      - name: Download qualified per-architecture digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: tmp/image-digests
          merge-multiple: true

      # The public tags reference only the digests the image job qualified and pushed.
      - name: Create multi-platform release tags from the qualified digests
        id: docker
        env:
          AMC_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          set -euo pipefail
          digest() { jq -er --arg arch "$1" 'select(.arch == $arch) | .digest | select(test("^sha256:[a-f0-9]{64}$"))' "tmp/image-digests/$1.json"; }
          AMD64=$(digest amd64)
          ARM64=$(digest arm64)
          docker buildx imagetools create -t "$AMC_REPOSITORY:$AMC_RELEASE_TAG" -t "$AMC_REPOSITORY:latest" \
            "$AMC_REPOSITORY@$AMD64" "$AMC_REPOSITORY@$ARM64"
          RAW=$(docker buildx imagetools inspect --raw "$AMC_REPOSITORY:$AMC_RELEASE_TAG")
          LISTED=$(jq -r '[.manifests[] | select(.platform.os == "linux") | "\(.platform.architecture)=\(.digest)"] | sort | join(",")' <<<"$RAW")
          [ "$LISTED" = "amd64=$AMD64,arm64=$ARM64" ] || { echo "index lists $LISTED"; exit 1; }
          INDEX=$(docker buildx imagetools inspect "$AMC_REPOSITORY:$AMC_RELEASE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          jq -s --arg repository "$AMC_REPOSITORY" --arg tag "$AMC_RELEASE_TAG" --arg index "$INDEX" \
            '{repository: $repository, tags: [$tag, "latest"], indexDigest: $index, platforms: sort_by(.arch)}' \
            tmp/image-digests/amd64.json tmp/image-digests/arm64.json > dist/release-assets/image-digests.json
          {
            echo "### Studio image digests"
            echo
            echo '```json'
            cat dist/release-assets/image-digests.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$INDEX" >> "$GITHUB_OUTPUT"

      # A release tag never ships unsigned, and the bundle is verified only against the release key P0-37 commits,
      # never against a key the bundle or the signing secret carries.
      - name: Build and verify the signed release bundle
        env:
          AMC_RELEASE_SIGNING_KEY: ${{ secrets.AMC_RELEASE_SIGNING_KEY }}
          AMC_DOCKER_IMAGE: ${{ steps.image.outputs.repository }}:${{ env.AMC_RELEASE_TAG }}
          AMC_DOCKER_DIGEST: ${{ steps.docker.outputs.digest }}
          AMC_DOCKER_PLATFORMS: linux/amd64,linux/arm64
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=$(node -e 'const pkg=require("./package.json");process.stdout.write(pkg.version)')
          if [ -z "$AMC_RELEASE_SIGNING_KEY" ]; then
            echo "::error::AMC_RELEASE_SIGNING_KEY is not set in the release environment (P0-38). A release is never published unsigned."
            exit 1
          fi
          if [ ! -f trust/amc-release-signing.pub ]; then
            echo "::error::trust/amc-release-signing.pub is missing (P0-37 commits the release public key). The bundle cannot be verified against a pinned key."
            exit 1
          fi
          node dist/cli.js release pack --out "dist/amc-${VERSION}.amcrelease"
          node dist/cli.js release verify "dist/amc-${VERSION}.amcrelease" --pubkey trust/amc-release-signing.pub | tee dist/release-verify.txt
          tar -xzf "dist/amc-${VERSION}.amcrelease" -C dist
          cp dist/amc-release/artifacts/sbom/sbom.cdx.json dist/sbom.cdx.json
          cp dist/amc-release/artifacts/licenses/licenses.json dist/licenses.json
          cp dist/amc-release/artifacts/provenance/provenance.json dist/provenance.json

      - name: Build experimental SEA binary artifact
        run: |
          npm run build:sea
          VERSION=$(node -e 'const pkg=require("./package.json");process.stdout.write(pkg.version)')
          mkdir -p dist/release-binaries
          cp dist/sea/amc "dist/release-binaries/amc-linux-x64-sea-${VERSION}"
          cp dist/sea/manifest.json "dist/release-binaries/amc-linux-x64-sea-${VERSION}.manifest.json"

      # Trusted publishing needs npm 11.5.1 or later; pin the exact CLI the publish step logs.
      - name: Pin the npm CLI
        run: |
          npm install -g npm@11.10.1
          npm --version

      # P0-38 chooses trusted publishing (no token; id-token: write is granted above) or a granular NPM_TOKEN in the
      # release environment. Without either, npm publish fails and so does the job: nothing is skipped silently.
      - name: Publish the npm package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          echo "npm $(npm --version)"
          PACKAGE_NAME=$(node -e 'process.stdout.write(require("./package.json").name)')
          VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already on npm; not publishing it again."
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the NPM_TOKEN of the release environment."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "No NPM_TOKEN: publishing through npm trusted publishing (OIDC)."
            unset NODE_AUTH_TOKEN
          fi
          npm publish --provenance --access public

      - name: Build release notes
        run: |
          set -euo pipefail
          VERSION=$(node -e 'const pkg=require("./package.json");process.stdout.write(pkg.version)')
          NOTES="docs/releases/${VERSION}.md"
          [ -f "$NOTES" ] || { echo "::error::$NOTES is missing; run npm run release:prepare -- ${VERSION}"; exit 1; }
          {
            cat "$NOTES"
            echo
            echo "## Signed bundle verification"
            echo
            echo '```text'
            cat dist/release-verify.txt
            echo '```'
          } > dist/release-notes.md

      - name: Update Homebrew formula when its release credentials are configured
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Homebrew tap credentials are not configured; leaving the channel unavailable."
            exit 0
          fi
          VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          TARBALL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/agent-maturity-compass-${VERSION}.tgz"
          SHA256=$(awk -v asset="agent-maturity-compass-${VERSION}.tgz" '$2 == asset { print $1 }' dist/release-assets/SHA256SUMS)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/AgentMaturity/homebrew-tap.git" /tmp/homebrew-tap
          sed -i "s|url \".*\"|url \"${TARBALL}\"|" /tmp/homebrew-tap/Formula/amc.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" /tmp/homebrew-tap/Formula/amc.rb
          cd /tmp/homebrew-tap
          git config user.name "AMC Release Bot"
          git config user.email "releases@agentmaturity.co"
          git add Formula/amc.rb
          git diff --staged --quiet || git commit -m "chore: bump amc formula to v${VERSION}"
          git push

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AMC_RELEASE_TAG }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/release-assets/*
            dist/*.amcrelease
            dist/sbom.cdx.json
            dist/licenses.json
            dist/provenance.json
            dist/release-verify.txt
            dist/release-binaries/*
