name: Nightly compatibility matrix

# Platform lanes for docs/PLATFORM_MATRIX.md (P2-06). Each lane uploads lane.json (amc.platform-lane/1) with its
# outputs; scripts/gen-platform-matrix.mjs turns one run's artifacts into the matrix. Nothing is typed by hand.
# TODO(P2-06 follow-up): confirm the ubuntu-24.04-arm runner label in GitHub's runner documentation.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Qualify the installed artifact and launcher recovery
        run: npm run qualify:platform -- --out tmp/platform-qualification/report.json
      - name: Doctor native-modules check (must PASS)
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/platform-qualification
          node dist/cli.js doctor --json > tmp/platform-qualification/doctor.json || true
          node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));const c=d.checks.find((x)=>x.id==="native-modules");console.log(`native-modules: ${c?.status}`);process.exit(c?.status==="PASS"?0:1)' tmp/platform-qualification/doctor.json
      - name: Lane receipt
        if: always()
        shell: bash
        run: mkdir -p tmp/platform-qualification && node -e 'require("node:fs").writeFileSync("tmp/platform-qualification/lane.json",JSON.stringify({schema:"amc.platform-lane/1",kind:"platform",platform:process.platform,arch:process.arch,nodeMajor:Number(process.versions.node.split(".")[0]),commit:process.env.GITHUB_SHA,runner:process.env.RUNNER_NAME??null},null,2)+"\n")'
      - name: Upload actual platform receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ matrix.os }}-node${{ matrix.node-version }}
          path: tmp/platform-qualification/
          if-no-files-found: warn

  desktop-installers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Package and verify desktop installers
        shell: bash
        run: |
          mkdir -p tmp/desktop-qualification
          npm run package:desktop
          npm run -s package:desktop:verify > tmp/desktop-qualification/desktop.json || { echo '{"status":"failed"}' > tmp/desktop-qualification/desktop.json; exit 1; }
      - name: Doctor native-modules check (must PASS)
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/desktop-qualification
          node dist/cli.js doctor --json > tmp/desktop-qualification/doctor.json || true
          node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));const c=d.checks.find((x)=>x.id==="native-modules");console.log(`native-modules: ${c?.status}`);process.exit(c?.status==="PASS"?0:1)' tmp/desktop-qualification/doctor.json
      - name: Lane receipt
        if: always()
        shell: bash
        run: node -e 'require("node:fs").writeFileSync("tmp/desktop-qualification/lane.json",JSON.stringify({schema:"amc.platform-lane/1",kind:"desktop",platform:process.platform,arch:process.arch,nodeMajor:Number(process.versions.node.split(".")[0]),commit:process.env.GITHUB_SHA,runner:process.env.RUNNER_NAME??null},null,2)+"\n")'
      - name: Upload desktop receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: tmp/desktop-qualification/
          if-no-files-found: warn
