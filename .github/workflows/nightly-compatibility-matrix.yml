name: Nightly compatibility matrix

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Qualify the installed artifact and launcher recovery
        run: npm run qualify:platform -- --out tmp/platform-qualification/report.json
      - name: Upload actual platform receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ matrix.os }}-node${{ matrix.node-version }}
          path: tmp/platform-qualification/
          if-no-files-found: warn
