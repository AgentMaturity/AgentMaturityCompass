<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMC Terminal Demo — Agent Maturity Compass</title>
<meta name="description" content="A recorded first run of Agent Maturity Compass: type amc, try the demo chat, check sign-in, and see an honest empty first score.">
<link rel="stylesheet" href="brand.css">
<style>
  :root {
    --bg: #0a0a0a;
    --green: #00ff41;
    --green-dim: #009926;
    --text: #b0b0b0;
    --text2: #8cc88c;
    --border: rgba(0,255,65,0.12);
    --mono: var(--amc-font-mono);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  *:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  body {
    background: #050505;
    color: var(--text);
    font-family: var(--mono), monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .back-link {
    position: fixed;
    top: 1rem;
    left: 1.5rem;
    color: var(--green);
    text-decoration: none;
    font-size: 0.8rem;
    z-index: 10;
  }
  .back-link:hover { text-shadow: 0 0 10px rgba(0,255,65,0.4); }
  .terminal {
    width: 100%;
    max-width: 780px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,255,65,0.05), 0 20px 40px rgba(0,0,0,0.5);
  }
  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #111;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }
  .terminal-title {
    flex: 1;
    text-align: center;
    font-size: 0.7rem;
    color: var(--amc-dim);
    margin-right: 44px;
  }
  .terminal-body {
    padding: 20px;
    min-height: 380px;
    font-size: 0.82rem;
    line-height: 1.65;
    overflow: hidden;
  }
  .line { white-space: pre-wrap; word-break: break-all; }
  .line .prompt { color: var(--green); font-weight: 700; }
  .line .cmd { color: #e0e0e0; }
  .line .output { color: var(--text2); }
  .line .highlight { color: var(--green); font-weight: 700; }
  .line .dim { color: var(--amc-dim); }
  .line .warn { color: #febc2e; }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--green);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .cta {
    margin-top: 2rem;
    text-align: center;
  }
  .cta a {
    display: inline-block;
    padding: 14px 32px;
    background: var(--green);
    color: #000;
    text-decoration: none;
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: 4px;
    transition: all 0.3s;
    box-shadow: 0 0 30px rgba(0,255,65,0.2);
  }
  .cta a:hover {
    box-shadow: 0 0 50px rgba(0,255,65,0.35);
    transform: translateY(-2px);
  }
  .cta p {
    margin-top: 0.75rem;
    font-size: 0.7rem;
    color: var(--amc-dim);
  }

  @media (max-width: 600px) {
    .terminal-body { font-size: 0.7rem; padding: 12px; min-height: 300px; }
  }
</style>
<style id="skip-link-style">
.skip-link{position:fixed;left:-9999px;top:12px;z-index:10000;padding:8px 14px;background:#4AEF79;color:#0a0a0a;font:700 14px system-ui,sans-serif;text-decoration:none}
.skip-link:focus,.skip-link:focus-visible{left:12px}
:where(a,button,input,select,textarea,[tabindex]:not([tabindex="-1"])):focus-visible{outline:2px solid #4AEF79;outline-offset:3px}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div id="main-content" tabindex="-1"></div>
  <a href="index.html" class="back-link">← Back to AMC</a>

  <div class="terminal" role="img" aria-label="Animated terminal replay of a recorded AMC first run: the amc menu, the demo chat, amc login status, and an empty first score">
    <div class="terminal-bar">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <div class="terminal-title">~/my-agent — zsh</div>
    </div>
    <div class="terminal-body" id="term"><noscript><pre style="white-space:pre-wrap;margin:0">$ amc
? What do you want to do?
&gt; Try a demo chat (no account or key needed)
you&gt; hello
Recorded reply: stub provider: 3 message(s) in view; you last said "hello".
$ amc login status
Codex        signed-out     next: amc login codex
$ amc        # choose: Just show my score
Overall: L0.00 (0/100) UNRELIABLE — DO NOT USE FOR CLAIMS
AMC has not seen your agent do anything yet, so this score is empty.</pre></noscript></div>
  </div>

  <div class="cta">
    <a href="index.html#install">Try it yourself →</a>
    <p>Recorded from the current source build on 2026-11-14 in a new folder. The one-line installers give the older 1.1.1 release, which has no menu.</p>
  </div>

<script>
(function() {
  const term = document.getElementById('term');
  const PAUSE = 800;
  const TYPE_SPEED = 35;
  const OUTPUT_SPEED = 12;

  // Recorded from the current source build on 2026-11-14 in a new, empty folder (lines shortened, not invented).
  const scenes = [
    {
      cmd: 'amc',
      output: [
        { text: 'AMC set up this folder (.amc/).', cls: 'dim' },
        { text: '? What do you want to do?', cls: 'highlight' },
        { text: '  Sign in to Codex first', cls: 'output' },
        { text: '> Try a demo chat (no account or key needed)', cls: 'highlight' },
        { text: '  Open the console in my browser', cls: 'output' },
        { text: '  Just show my score (empty for now)', cls: 'output' },
        { text: '', cls: '' },
        { text: 'Native chat · agent default · provider stub · model amc-stub-1', cls: 'output' },
        { text: 'Local demonstration: canned replies, no real model answer.', cls: 'dim' },
        { text: 'Every turn writes AMC session evidence.', cls: 'dim' },
        { text: 'you> hello', cls: 'output' },
        { text: 'Recorded reply:', cls: 'output' },
        { text: 'stub provider: 3 message(s) in view; you last said "hello".', cls: 'highlight' },
      ]
    },
    {
      cmd: 'amc login status',
      output: [
        { text: 'Sign-in for the agents AMC can watch', cls: 'output' },
        { text: '  Claude Code  not-installed  next: install Claude Code, then: amc login claude', cls: 'output' },
        { text: '  Codex        signed-out     next: amc login codex', cls: 'output' },
        { text: 'AMC starts the vendor\'s own sign-in and reads its status answer. It never sees or stores a password, token or plan.', cls: 'dim' },
      ]
    },
    {
      cmd: 'amc        # choose: Just show my score',
      output: [
        { text: 'AMC Full Score · Questions: 244', cls: 'output' },
        { text: 'Artifact seal: VALID | Evidence: INSUFFICIENT_EVIDENCE | Claims: BLOCKED', cls: 'output' },
        { text: 'Overall: L0.00 (0/100) UNRELIABLE — DO NOT USE FOR CLAIMS', cls: 'highlight' },
        { text: 'AMC has not seen your agent do anything yet, so this score is empty.', cls: 'output' },
        { text: 'Signing proves integrity, not evidence sufficiency.', cls: 'dim' },
      ]
    }
  ];

  let playing = true;

  function clearTerm() {
    term.innerHTML = '';
  }

  function addLine(html) {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = html;
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
    return div;
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async function typeText(element, text, speed) {
    for (let i = 0; i < text.length; i++) {
      element.textContent += text[i];
      term.scrollTop = term.scrollHeight;
      await sleep(speed + Math.random() * speed * 0.5);
    }
  }

  async function playScene(scene) {
    // Show prompt with typing
    const line = addLine('<span class="prompt">$ </span><span class="cmd"></span><span class="cursor"></span>');
    const cmdSpan = line.querySelector('.cmd');
    const cursorSpan = line.querySelector('.cursor');

    await typeText(cmdSpan, scene.cmd, TYPE_SPEED);

    // Remove cursor, "execute"
    cursorSpan.remove();
    await sleep(PAUSE);

    // Print output lines
    for (const out of scene.output) {
      if (out.text === '') {
        addLine('&nbsp;');
      } else {
        const outLine = addLine(`<span class="${out.cls}"></span>`);
        const span = outLine.querySelector('span');
        await typeText(span, out.text, OUTPUT_SPEED);
      }
      await sleep(40);
    }

    await sleep(PAUSE);
  }

  async function playAll() {
    while (playing) {
      clearTerm();
      for (const scene of scenes) {
        await playScene(scene);
      }
      // Show final cursor
      addLine('<span class="prompt">$ </span><span class="cursor"></span>');
      await sleep(4000);
    }
  }

  playAll();
})();
</script>
</body>
</html>
