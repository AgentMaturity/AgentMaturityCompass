version: "3.9"

services:
  amc-studio:
    build:
      context: ..
      dockerfile: Dockerfile
      target: studio
    image: amc-studio:local
    container_name: amc-studio
    restart: unless-stopped
    ports:
      - "3210:3210"   # Gateway proxy
      - "3211:3211"   # Transparent proxy
      - "3212:3212"   # Studio API
      - "3213:3213"   # Toolhub
      - "4173:4173"   # Dashboard UI
    volumes:
      - amc-data:/data/amc
    environment:
      - NODE_ENV=production
      - AMC_BIND=0.0.0.0
      - AMC_ALLOWED_CIDRS=${AMC_ALLOWED_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      - AMC_BOOTSTRAP=1
      - AMC_VAULT_PASSPHRASE_FILE=/run/secrets/amc_vault_passphrase
      - AMC_BOOTSTRAP_OWNER_USERNAME_FILE=/run/secrets/amc_owner_username
      - AMC_BOOTSTRAP_OWNER_PASSWORD_FILE=/run/secrets/amc_owner_password
    healthcheck:
      test: ["CMD", "amc", "studio", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /home/amc:uid=10001,gid=10001,mode=0700
    secrets:
      - amc_vault_passphrase
      - amc_owner_username
      - amc_owner_password

volumes:
  amc-data:
    driver: local

secrets:
  amc_vault_passphrase:
    file: ../deploy/compose/secrets/amc_vault_passphrase.txt
  amc_owner_username:
    file: ../deploy/compose/secrets/amc_owner_username.txt
  amc_owner_password:
    file: ../deploy/compose/secrets/amc_owner_password.txt
