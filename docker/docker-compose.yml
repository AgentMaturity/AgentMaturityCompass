version: "3.9"

services:
  amc-studio:
    build:
      context: ..
      dockerfile: Dockerfile
      target: studio
    image: amc-studio:local
    container_name: amc-studio
    restart: unless-stopped
    # Studio drains up to 10 s, then seals its session; the default 10 s can kill it before the seal.
    stop_grace_period: 40s
    # Loopback by default: AMC_ALLOWED_CIDRS is a request filter, not a bind restriction.
    ports:
      - "${AMC_PUBLISH_ADDRESS:-127.0.0.1}:${AMC_GATEWAY_PORT:-3210}:3210"   # Gateway proxy
      - "${AMC_PUBLISH_ADDRESS:-127.0.0.1}:${AMC_PROXY_PORT:-3211}:3211"   # Transparent proxy
      - "${AMC_PUBLISH_ADDRESS:-127.0.0.1}:${AMC_STUDIO_PORT:-3212}:3212"   # Studio API
      - "${AMC_PUBLISH_ADDRESS:-127.0.0.1}:${AMC_TOOLHUB_PORT:-3213}:3213"   # Toolhub
      - "${AMC_PUBLISH_ADDRESS:-127.0.0.1}:${AMC_DASHBOARD_PORT:-4173}:4173"   # Dashboard UI
    volumes:
      - amc-data:/data/amc
      # P1-08: anti-rollback marks and key-set recovery copies (<AMC home>/state) must survive a restart.
      - amc-state:/home/amc/.config/amc/state
      # Signed control journals (firewall, guardrails, legal holds, compiled controls) checkpoint here; must persist and stay outside /data/amc (src/lifecycle/signedControlJournalRecords.ts).
      - amc_control_checkpoints:/workspace
    environment:
      - NODE_ENV=production
      - AMC_CONTROL_CHECKPOINT_DIR=/workspace/control-checkpoints
      - AMC_BIND=0.0.0.0
      - AMC_ALLOWED_CIDRS=${AMC_ALLOWED_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # Native and A4 routes admit only the bind host or these browser origins (src/studio/nativeAdmission.ts); amc-verify calls http://amc-studio:3212. Append LAN/phone origins through AMC_EXTRA_ORIGINS; an origin is scheme://host[:port] with no path.
      - AMC_CORS_ALLOWED_ORIGINS=http://amc-studio:3212,http://localhost:${AMC_STUDIO_PORT:-3212},http://127.0.0.1:${AMC_STUDIO_PORT:-3212},${AMC_EXTRA_ORIGINS:-}
      - AMC_BOOTSTRAP=1
      - AMC_VAULT_PASSPHRASE_FILE=/run/secrets/amc_vault_passphrase
      - AMC_BOOTSTRAP_OWNER_USERNAME_FILE=/run/secrets/amc_owner_username
      - AMC_BOOTSTRAP_OWNER_PASSWORD_FILE=/run/secrets/amc_owner_password
    healthcheck:
      test: ["CMD", "amc", "studio", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # The image owns the 0700 home; the state and checkpoint volumes are its only writable paths besides /data/amc and /tmp.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    secrets:
      - amc_vault_passphrase
      - amc_owner_username
      - amc_owner_password

  # One-shot governed-turn check: `docker compose -f docker/docker-compose.yml --profile verify run --rm amc-verify`.
  # Same probe as the Helm test pod (scripts/deploy/governed-turn-probe.mjs); exits 0 only on a verified turn.
  amc-verify:
    profiles: ["verify"]
    image: amc-studio:local
    depends_on:
      amc-studio:
        condition: service_healthy
    entrypoint: ["node", "/probe/governed-turn-probe.mjs"]
    command:
      - --base-url
      - http://amc-studio:3212
      - --username-file
      - /run/secrets/amc_owner_username
      - --password-file
      - /run/secrets/amc_owner_password
      - --ready-timeout-ms
      - "60000"
    volumes:
      - ../scripts/deploy/governed-turn-probe.mjs:/probe/governed-turn-probe.mjs:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    secrets:
      - amc_owner_username
      - amc_owner_password

volumes:
  amc-data:
    driver: local
  amc-state:
    driver: local
  amc_control_checkpoints:
    driver: local

secrets:
  amc_vault_passphrase:
    file: ../deploy/compose/secrets/amc_vault_passphrase.txt
  amc_owner_username:
    file: ../deploy/compose/secrets/amc_owner_username.txt
  amc_owner_password:
    file: ../deploy/compose/secrets/amc_owner_password.txt
