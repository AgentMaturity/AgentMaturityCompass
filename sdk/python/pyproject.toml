[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amc-sdk"
version = "0.2.0"
description = "Drive a governed AMC agent from Python, and prove afterwards that it ran."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No dependencies, deliberately. The transport is subprocess + json + threading;
# a dependency here would be a supply-chain question asked on behalf of every
# user of a client whose whole job is to talk to a local process over a pipe.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["amc_sdk"]

[tool.setuptools.package-data]
amc_sdk = ["py.typed"]
