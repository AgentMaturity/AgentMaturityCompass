<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMC Studio - Ops</title>
    <link rel="stylesheet" href="./assets/styles.css?v=20260711a" />
    <style>
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px;
      }
      .card {
        border: 1px solid #d0d7de;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
        background: #fff;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid #1f2937;
        background: #111827;
        color: #fff;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #111827;
      }
      pre {
        background: #0b1020;
        color: #d1e8ff;
        border-radius: 8px;
        padding: 10px;
        overflow: auto;
        font-size: 12px;
      }
      .warn {
        color: #b91c1c;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Operations</h1>
      <p>Retention, maintenance, backup freshness, and readiness.</p>
      <div class="card">
        <h2>Readiness</h2>
        <div id="ready"></div>
      </div>
      <div class="card">
        <h2>Retention</h2>
        <div id="retention"></div>
        <div class="row" style="margin-top: 8px">
          <button id="retention-dry">Run Dry-Run</button>
          <button id="retention-run">Run Retention</button>
        </div>
      </div>
      <div class="card">
        <h2>Maintenance</h2>
        <div id="maintenance"></div>
        <div class="row" style="margin-top: 8px">
          <button class="secondary" id="vacuum">Vacuum</button>
          <button class="secondary" id="prune">Prune Cache</button>
        </div>
      </div>
      <div class="card">
        <h2>Backup Freshness</h2>
        <div id="backup"></div>
      </div>
      <div class="card">
        <h2>Last Action</h2>
        <pre id="out">No action run yet.</pre>
      </div>
    </main>
    <script type="module" src="./assets/ops.js"></script>
  </body>
</html>
