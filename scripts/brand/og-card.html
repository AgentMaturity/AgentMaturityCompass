<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=1.0">
  <meta name="description" content="Build an AI agent for work that gets audited. Build, run and check AI agents for regulated work. Evidence over claims.">
  <title>Agent Maturity Compass</title>
  <!-- The social card (website/og-card.png, 1200x630), in the home page's design. Render it with `npm run brand:render`.
       Fonts come from the installed @fontsource packages, so the picture is the same on every machine. -->
  <style>
    @font-face { font-family: "Inter"; src: url("../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Inter"; src: url("../../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "Space Mono"; src: url("../../node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: "Space Mono"; src: url("../../node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #0a0a0a radial-gradient(60% 70% at 88% 8%, rgba(74, 239, 121, 0.13), transparent 70%);
      color: #c9cac5;
      font-family: "Inter", system-ui, sans-serif;
    }
    .frame { position: relative; height: 100%; padding: 52px 64px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 48px; }
    .mono { font-family: "Space Mono", ui-monospace, monospace; }
    .wordmark { font-size: 34px; font-weight: 700; color: #fff; }
    .accent { color: #4AEF79; }
    .copy { display: flex; flex-direction: column; }
    h1 { margin-top: auto; font-size: 66px; line-height: 1.04; font-weight: 700; color: #fff; letter-spacing: 0; }
    .line { margin-top: 26px; font-size: 25px; line-height: 1.4; max-width: 30em; }
    .foot { margin-top: 34px; display: flex; gap: 28px; font-size: 16px; color: #8d8e89; }
    .foot strong { color: #4AEF79; font-weight: 700; }
    .sheet { align-self: center; position: relative; background: #f1f2ec; color: #12140e; border-radius: 4px; padding: 24px 22px 18px; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6); }
    .sheet::before { content: ""; position: absolute; left: 0; right: 0; top: -7px; height: 8px; background: radial-gradient(circle at 6px 0, transparent 5px, #f1f2ec 5.5px) 0 0 / 12px 8px repeat-x; }
    .sheet-title { font-weight: 700; font-size: 16px; }
    .sheet-note { margin: 4px 0 12px; font-size: 13px; color: #595d50; }
    ol { list-style: none; counter-reset: entry; border-top: 1px dashed rgba(18, 20, 14, 0.16); }
    li { counter-increment: entry; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed rgba(18, 20, 14, 0.16); font-size: 13px; }
    li::before { content: counter(entry, decimal-leading-zero); color: #595d50; }
    li em { font-style: normal; color: #595d50; }
    li b::after { content: "signed off"; margin-left: 8px; padding: 1px 6px; border-radius: 3px; background: #1d7a3c; color: #fff; font-weight: 400; font-size: 11px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="frame">
    <section class="copy">
      <div class="wordmark mono">amc<span class="accent">_</span></div>
      <h1>Build an AI agent for work that gets audited<span class="accent">_</span></h1>
      <p class="line">Build, run and check AI agents for regulated work.</p>
      <p class="foot mono"><strong>Evidence over claims.</strong><span>agentmaturity.co</span></p>
    </section>
    <aside class="sheet mono" aria-label="An example project record">
      <p class="sheet-title">Project record</p>
      <p class="sheet-note">An example</p>
      <ol>
        <li><span><b>Brief approved</b></span><em>approver</em></li>
        <li><span><b>Build approved</b></span><em>2 people</em></li>
        <li><span><b>Controls approved</b></span><em>2 people</em></li>
        <li><span><b>Release approved</b></span><em>2 people</em></li>
      </ol>
    </aside>
  </div>
</body>
</html>
