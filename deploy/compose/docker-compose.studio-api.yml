# Optional overlay for docker-compose.tls.yml. Both existing services stay intact.
services:
  amc-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    image: ${AMC_API_IMAGE:-amc-api:local}
    restart: unless-stopped
    # Same stop budget as Studio and deploy/k8s (40 s), so a recreate lets in-flight requests finish.
    stop_grace_period: 40s
    environment:
      PORT: "3220"
      NODE_ENV: production
    expose:
      - "3220"
    volumes:
      - amc_data:/data/amc:ro
      # P1-08: anti-rollback marks and key-set recovery copies (<AMC home>/state) must survive a restart.
      - amc_api_state:/home/amc/.config/amc/state
    # The image owns the 0700 home; the state volume is its only writable path besides /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    depends_on:
      - amc-studio
      - amc-api
    volumes:
      - ./Caddyfile.studio-api:/etc/caddy/Caddyfile:ro

volumes:
  amc_api_state:
