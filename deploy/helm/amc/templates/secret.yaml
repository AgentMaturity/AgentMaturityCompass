{{- if .Values.bootstrap.createSecret }}
{{- /*
Off by default: create the bootstrap Secret out of band (docs/KUBERNETES_HELM_DEPLOYMENT.md).
With createSecret=true every value must be supplied and none may start with the published placeholder prefix.
All five keys are required so enabling the notary later needs no new Secret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bootstrap.vaultPassphraseSecret.name }}
  labels:
    {{- include "amc.labels" . | nindent 4 }}
  annotations:
    # Uninstall/upgrade/rollback must never delete the vault passphrase of a live workspace.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.bootstrap.vaultPassphraseSecret.key }}: {{ include "amc.bootstrapValue" (list "vaultPassphrase" .Values.bootstrap.values.vaultPassphrase) }}
  {{ .Values.bootstrap.ownerUsernameSecret.key }}: {{ include "amc.bootstrapValue" (list "ownerUsername" .Values.bootstrap.values.ownerUsername) }}
  {{ .Values.bootstrap.ownerPasswordSecret.key }}: {{ include "amc.bootstrapValue" (list "ownerPassword" .Values.bootstrap.values.ownerPassword) }}
  {{ .Values.notary.passphraseSecret.key }}: {{ include "amc.bootstrapValue" (list "notaryPassphrase" .Values.bootstrap.values.notaryPassphrase) }}
  {{ .Values.notary.authSecret.key }}: {{ include "amc.bootstrapValue" (list "notaryAuthSecret" .Values.bootstrap.values.notaryAuthSecret) }}
{{- end }}
