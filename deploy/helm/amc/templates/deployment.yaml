{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: the AMC workspace (SQLite ledger on a ReadWriteOnce volume) has a single writer" }}
{{- end }}
{{- if and .Values.image.requireDigest (not .Values.image.digest) }}
{{- fail "image.requireDigest is true but image.digest is empty: deploy by sha256 digest" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amc.fullname" . }}
  labels:
    {{- include "amc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate: a rolling update would run two pods against one workspace.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "amc.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "amc.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "amc.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: amc-studio
          image: "{{- if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{- else }}{{ .Values.image.repository }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-lc"]
          args:
            - >
              if [ "${AMC_BOOTSTRAP:-1}" = "1" ]; then
                amc bootstrap --workspace {{ .Values.workspace.mountPath }};
              fi;
              exec amc studio start --workspace {{ .Values.workspace.mountPath }} --bind ${AMC_BIND:-0.0.0.0} --port ${AMC_STUDIO_PORT:-3212}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "amc.fullname" . }}-config
          env:
            - name: AMC_BOOTSTRAP
              value: {{ ternary "1" "0" .Values.bootstrap.enabled | quote }}
            - name: AMC_VAULT_PASSPHRASE_FILE
              value: /run/secrets/amc_vault_passphrase
            - name: AMC_BOOTSTRAP_OWNER_USERNAME_FILE
              value: /run/secrets/amc_owner_username
            - name: AMC_BOOTSTRAP_OWNER_PASSWORD_FILE
              value: /run/secrets/amc_owner_password
            {{- if .Values.notary.enabled }}
            - name: AMC_NOTARY_AUTH_SECRET_FILE
              value: /run/secrets/amc_notary_auth_secret
            {{- end }}
          ports:
            - name: studio
              containerPort: {{ .Values.service.port }}
            - name: gateway
              containerPort: {{ .Values.service.gatewayPort }}
            - name: proxy
              containerPort: {{ .Values.service.proxyPort }}
          # startup covers `amc bootstrap`; readiness gates traffic on signed-policy
          # trust and ledger reachability; liveness only checks the process answers.
          startupProbe:
            httpGet:
              path: /healthz
              port: studio
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: studio
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: studio
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.workspace.mountPath }}
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      {{- if .Values.notary.enabled }}
        - name: amc-notary
          image: "{{- if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{- else }}{{ .Values.image.repository }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["amc"]
          args: ["notary", "start", "--notary-dir", "/data/notary", "--workspace", "{{ .Values.workspace.mountPath }}"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: AMC_NOTARY_DIR
              value: /data/notary
            - name: AMC_NOTARY_PASSPHRASE_FILE
              value: /run/secrets/amc_notary_passphrase
            - name: AMC_NOTARY_AUTH_SECRET_FILE
              value: /run/secrets/amc_notary_auth_secret
          ports:
            - name: notary
              containerPort: {{ .Values.notary.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: notary
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: notary
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: notary
              mountPath: /data/notary
            - name: workspace
              mountPath: {{ .Values.workspace.mountPath }}
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      {{- end }}
      volumes:
        - name: workspace
          {{- if .Values.workspace.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "amc.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Secrets are created out of band (see docs/KUBERNETES_HELM_DEPLOYMENT.md);
        # the chart only references them, so no default value can be rendered.
        - name: secrets
          projected:
            sources:
              {{- $refs := list (list .Values.bootstrap.vaultPassphraseSecret "amc_vault_passphrase") (list .Values.bootstrap.ownerUsernameSecret "amc_owner_username") (list .Values.bootstrap.ownerPasswordSecret "amc_owner_password") }}
              {{- if .Values.notary.enabled }}
              {{- $refs = concat $refs (list (list .Values.notary.passphraseSecret "amc_notary_passphrase") (list .Values.notary.authSecret "amc_notary_auth_secret")) }}
              {{- end }}
              {{- range $refs }}
              - secret:
                  name: {{ (index . 0).name }}
                  items:
                    - key: {{ (index . 0).key }}
                      path: {{ index . 1 }}
              {{- end }}
        {{- if .Values.notary.enabled }}
        - name: notary
          {{- if .Values.notary.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "amc.fullname" . }}-notary
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
