ingress:
  enabled: true
  className: nginx
  hosts:
    - host: amc.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: amc-example-tls
      hosts:
        - amc.example.internal

env:
  AMC_BIND: "0.0.0.0"
  AMC_TRUSTED_PROXY_HOPS: "1"
  # Required: your ingress controller pods' addresses or pod CIDR (kubectl -n ingress-nginx get pods -o wide), for
  # example --set env.AMC_TRUSTED_PROXY_CIDRS=10.244.1.17/32. The chart refuses to render while it is empty, and refuses
  # documentation ranges (RFC 5737/3849), so a copied placeholder can never leave the real proxy untrusted.
  AMC_TRUSTED_PROXY_CIDRS: ""
  AMC_LAN_MODE: "true"
  # The Ingress origin, appended to the Service origin (docs/KUBERNETES_HELM_DEPLOYMENT.md, Verify Runtime: native admission).
  AMC_CORS_ALLOWED_ORIGINS: "https://amc.example.internal"

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  ingressPodSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    matchLabels:
      k8s-app: kube-dns
  dnsPorts:
    - 53
  allowedEgressCidrs:
    - 203.0.113.0/24
  allowedEgressPorts:
    - 443
